  function renderNotificationScheduleList() {
    const container = document.getElementById("notifScheduleList");
    if (!container) return;

    if (!window.store || !window.store.teams || Object.keys(window.store.teams).length === 0) {
      container.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding:10px;">目前尚無任何隊伍</div>`;
      return;
    }

    const now = new Date();
    const primaryUser = getPrimaryUser();
    const scope = localStorage.getItem(NOTIF_SCOPE_KEY) || "primary";
    const allChars = getAllCharacters();
    const primaryCharIds = new Set(allChars.filter(c => c.playerName === primaryUser).map(c => c.id));

    const scheduledTeams = [];

    Object.values(window.store.teams).forEach(team => {
      const schedule = getTeamEffectiveSchedule(team);
      if (!schedule) return;

      const members = team.memberTargets || (team.memberCharIds || []).map(id => ({ charId: id, entryIndex: 1 }));
      const hasPrimary = members.some(m => primaryCharIds.has(m.charId));
      if (scope === "primary" && !hasPrimary) return;

      const raidDate = getTeamRaidDateTimeThisWeek(schedule, now);
      if (!raidDate) return;

      const isCompleted = checkIfTeamCompletedThisWeek(team);

      // 找出隊伍所屬的 BOSS
      let bossName = "BOSS 隊伍";
      const records = Object.values(window.store.weeklyRecords || {});
      const sampleRec = records.find(r => r && r.teamId === team.id);
      if (sampleRec) {
        const b = window.config.bosses.find(bb => bb.id === sampleRec.bossId);
        if (b) bossName = b.name;
      }

      const memberNames = members.map(m => getCharName(m.charId)).join("、");
      const diffMs = raidDate.getTime() - now.getTime();
      const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
      const diffMins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));

      let countdownText = "";
      if (isCompleted) {
        countdownText = "✔️ 本週已完成";
      } else if (diffMs < 0) {
        countdownText = "⏳ 本週時間已過";
      } else if (diffHours > 24) {
        const days = Math.floor(diffHours / 24);
        countdownText = `還有 ${days} 天 ${diffHours % 24} 小時`;
      } else if (diffHours > 0) {
        countdownText = `還有 ${diffHours} 小時 ${diffMins} 分鐘`;
      } else {
        countdownText = `還有 ${Math.max(0, diffMins)} 分鐘`;
      }

      scheduledTeams.push({
        team,
        bossName,
        memberNames,
        schedule,
        raidDate,
        isCompleted,
        countdownText,
        diffMs
      });
    });

    if (scheduledTeams.length === 0) {
      const scopeDesc = scope === "primary" ? `「${primaryUser}」參與且有設定時間` : "有設定出團時間";
      container.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding:10px;">目前沒有${scopeDesc}的隊伍</div>`;
      return;
    }

    scheduledTeams.sort((a, b) => {
      if (a.isCompleted !== b.isCompleted) return a.isCompleted ? 1 : -1;
      return a.raidDate - b.raidDate;
    });

    container.innerHTML = scheduledTeams.map(item => `
      <div class="notif-schedule-card ${item.isCompleted ? 'completed' : ''}">
        <div>
          <div style="font-weight:bold; display:flex; align-items:center; gap:4px;">
            <span>${item.bossName}</span>
            <span class="team-schedule-badge ${item.schedule.isTemp ? 'temp' : ''}" style="margin:0;">${formatScheduleDisplay(item.schedule)}</span>
          </div>
          <div style="font-size:11px; color:var(--text-muted); margin-top:2px;">隊員：${item.memberNames}</div>
        </div>
        <div style="text-align:right; font-weight:bold; font-size:11px; color:${item.isCompleted ? 'var(--text-muted)' : (item.diffMs > 0 && item.diffMs <= 30 * 60000 ? '#ef4444' : '#0284c7')};">
          ${item.countdownText}
        </div>
      </div>
    `).join("");
  }

  function checkRaidReminders() {
    const isEnabled = localStorage.getItem(NOTIF_ENABLED_KEY) === "true";
    if (!isEnabled || !("Notification" in window) || Notification.permission !== "granted") {
      return;
    }
    if (!window.store || !window.store.teams || !window.config || !window.config.bosses) {
      return;
    }

    const now = new Date();
    const currentWeekKey = getCurrentResetWeekKey();
    const leadMinutes = parseInt(localStorage.getItem(NOTIF_LEAD_KEY) || "15", 10);
    const soundEnabled = localStorage.getItem(NOTIF_SOUND_KEY) !== "false";
    const scope = localStorage.getItem(NOTIF_SCOPE_KEY) || "primary";

    const primaryUser = getPrimaryUser();
    const allChars = getAllCharacters();
    const primaryCharIds = new Set(allChars.filter(c => c.playerName === primaryUser).map(c => c.id));

    Object.values(window.store.teams).forEach(team => {
      const schedule = getTeamEffectiveSchedule(team);
      if (!schedule) return;

      const members = team.memberTargets || (team.memberCharIds || []).map(id => ({ charId: id, entryIndex: 1 }));
      if (scope === "primary" && !members.some(m => primaryCharIds.has(m.charId))) {
        return;
      }

      const isCompleted = checkIfTeamCompletedThisWeek(team);
      if (isCompleted) return;

      const raidDate = getTeamRaidDateTimeThisWeek(schedule, now);
      if (!raidDate) return;

      const diffMinutes = (raidDate.getTime() - now.getTime()) / 60000;

      // 當前時間在：出團前 leadMinutes 至出團後 30 分鐘內
      if (diffMinutes <= leadMinutes && diffMinutes >= -30) {
        const notifyKey = `maple_notified_${team.id}_${currentWeekKey}_${schedule.isTemp ? 'temp_' : ''}${schedule.dayOfWeek}_${schedule.time}`;
        if (localStorage.getItem(notifyKey)) {
          return; // 這一輪已發過通知
        }

        // 找 BOSS 名稱
        let bossName = "BOSS";
        const records = Object.values(window.store.weeklyRecords || {});
        const sampleRec = records.find(r => r && r.teamId === team.id);
        if (sampleRec) {
          const b = window.config.bosses.find(bb => bb.id === sampleRec.bossId);
          if (b) bossName = b.name;
        }

        const memberNames = members.map(m => getCharName(m.charId)).join("、");
        const remainingDesc = diffMinutes > 0 ? `還有約 ${Math.ceil(diffMinutes)} 分鐘（${schedule.time}）` : `現在（${schedule.time}）`;
        const tempPrefix = schedule.isTemp ? "【臨時改時間】" : "";

        try {
          const notif = new Notification(`⏰ ${tempPrefix}出團提醒：【${bossName}】即將開始！`, {
            body: `預定開打：${remainingDesc}\n隊伍成員：${memberNames}`,
            icon: "favicon.ico"
          });
          notif.onclick = function() {
            window.focus();
            notif.close();
          };

          if (soundEnabled) {
            playNotificationChime();
          }

          localStorage.setItem(notifyKey, String(Date.now()));
        } catch (err) {
          console.error("發送通知失敗:", err);
        }
      }
    });
  }

  function initNotificationSystem() {
    updateNotificationUI();

    setInterval(checkRaidReminders, 30000);
    // 首次立即檢查一次
    setTimeout(checkRaidReminders, 2000);

      targetChars = allChars.filter(c => c.playerName === firstPlayerName);

        // 找出這個角色本來排定的所有難度，各自屬於哪個 BOSS 群組（例如 kalos_hard -> "kalos"）
        const ownGroupKeys = new Set((c.bossIds || []).map(bId => getBossGroupKey(bId)));

        // 收集這些群組底下，所有支援重置券的難度 —— 不限於角色本來排定的那一個，這樣才能選群組內的其他難度當重置目標
        const availableResetBosses = resetableBosses.filter(b => ownGroupKeys.has(getBossGroupKey(b.id)));

        if (availableResetBosses.length === 0) {
          columnsHtml += `<span style="font-size:12px; color:#94a3b8;">（該角色排定的 BOSS 群組中沒有支援重置券的難度）</span>`;
        } else {
          // 依群組分行顯示，同一隻 BOSS 的所有難度放在同一行
          const groupedMap = new Map();
          availableResetBosses.forEach(b => {
            const key = getBossGroupKey(b.id);

            groupedMap.get(key).push(b);

              const isChecked = c.resetBossIds && c.resetBossIds.includes(b.id);

              const crossTag = isOwnDifficulty ? '' : ' <span style="font-size:10px; color:#d97706;" title="這個難度不在角色本來排定的清單裡，勾選代表把重置券拿來跳打這個難度">🎟️跳難度</span>';

        }

  function toggleResetConfig(charId, bossId) {
    window.config.players.forEach(p => {
      (p.characters || []).forEach(c => {
        if (c.id === charId) {
          if (!c.resetBossIds) c.resetBossIds = [];
          const index = c.resetBossIds.indexOf(bossId);
          if (index > -1) {
            c.resetBossIds.splice(index, 1);
          } else {
            const normalCount = c.bossIds ? c.bossIds.length : 0;
            const resetCount = c.resetBossIds.length;
            const totalAfterAdd = normalCount + resetCount + 1;

            if (totalAfterAdd > 12) {
              alert(`角色 [${c.name}] 的 BOSS 攻略數量已達 12 隻上限（一般 ${normalCount} 隻 + 重置 ${resetCount} 隻），無法再新增重置券！`);
              const checkboxes = document.querySelectorAll(`input[onchange*="${charId}"][onchange*="${bossId}"]`);
              checkboxes.forEach(cb => { cb.checked = false; });
              return;
            }
            c.resetBossIds.push(bossId);
          }
        }
      });
    });

    if (window.db && window.dbRef && window.dbSet) {
      const playersRef = window.dbRef(window.db, '/players');
      window.dbSet(playersRef, window.config.players);

  // 檢查輸入的字串是不是「剛好一個」表情符號
  function isSingleEmoji(str) {
    const trimmed = (str || "").trim();
    if (!trimmed) return false;

    // 先用 Unicode 分類粗篩：整段字串只能由 emoji 相關的碼位組成
    // （Extended_Pictographic 涵蓋大部分圖像 emoji，加上組合用的 ZWJ、變化選擇符、膚色修飾符、性別符號）
    const emojiCharPattern = /^(\p{Extended_Pictographic}|\p{Emoji_Presentation}|[\u200D\uFE0F\u{1F3FB}-\u{1F3FF}\u2640\u2642])+$/u;
    if (!emojiCharPattern.test(trimmed)) return false;

    // 再確認視覺上「剛好是一個」字元（grapheme），排除貼了好幾個 emoji 疊在一起的情況
    if (typeof Intl !== "undefined" && Intl.Segmenter) {
      const segmenter = new Intl.Segmenter(undefined, { granularity: "grapheme" });
      return Array.from(segmenter.segment(trimmed)).length === 1;
    }

    // 舊瀏覽器沒有 Intl.Segmenter，退一步只靠上面的 Unicode 分類檢查
    return true;
  }

  async function saveAvatarEmoji() {
    const input = document.getElementById("avatarEmojiInput");
    const value = input.value.trim();

    if (value && !isSingleEmoji(value)) return;

    const player = window.config.players.find(p => p.name === editingAvatarPlayerName);
    if (!player) return;

    if (value) {
      player.avatarEmoji = value;

      const saveAsDefault = document.getElementById("avatarSaveAsDefaultCheckbox").checked;
      if (saveAsDefault) {
        addCustomAvatarEmoji(value);
      }
    } else {
      delete player.avatarEmoji;

    try {
      const playersRef = window.dbRef(window.db, '/players');
      await window.dbSet(playersRef, window.config.players);
      closeAvatarPickerModal();
      renderApp();

  async function submitAddPlayer() {
    const playerName = document.getElementById("newPlayerName").value.trim();

    if (!playerName) {
      alert("請輸入玩家名稱！");
      return;
    }

    const currentPlayers = window.config.players || [];

    const isExist = currentPlayers.some(p => p.name === playerName);
    if (isExist) {
      alert("該玩家名稱已存在！");
      return;
    }

    const newPlayer = {
      name: playerName,
      characters: []
    };

    const updatedPlayers = [...currentPlayers, newPlayer];

    try {
      const playersRef = window.dbRef(window.db, '/players');
      await window.dbSet(playersRef, updatedPlayers);
      closeAddPlayerModal();
    } catch (error) {
      console.error("寫入 Firebase 失敗：", error);
      alert("新增玩家失敗，請稍後再試！");
    }
  }

  function updatePartyCheckboxStates() {
      const boss = window.config.bosses.find(b => b.id === editingBossId);
      const maxPartySize = boss ? boss.maxPartySize : 1;

      // 取得所有 partyChar 的選取框
      const checkboxes = Array.from(document.querySelectorAll('input[name="partyChar"]'));
      // 計算目前已被勾選的數量
      const checkedCount = checkboxes.filter(cb => cb.checked).length;

      // 🔥 控制上限警告標語的顯示/隱藏
      const warningEl = document.getElementById("partyLimitWarning");
      if (warningEl) {
        if (checkedCount >= maxPartySize) {
          warningEl.style.display = "inline-block"; // 顯示紅字提示
        } else {
          warningEl.style.display = "none"; // 未達上限則隱藏
        }
      }

      checkboxes.forEach(cb => {
        const isSelf = cb.getAttribute('data-is-self') === 'true';

        // 自己始終保持勾選且不可切換
        if (isSelf) {
          cb.disabled = true;
          return;
        }

        const label = cb.closest('label');

        if (checkedCount >= maxPartySize) {
          // 達到上限：未勾選的項目設為 disabled
          if (!cb.checked) {
            cb.disabled = true;
            if (label) {
              label.style.opacity = '0.4';
              label.style.cursor = 'not-allowed';
            }
          } else {
            // 已勾選的非隊長項目，依然可以取消勾選
            cb.disabled = false;
            if (label) {
              label.style.opacity = '1';
              label.style.cursor = 'pointer';
            }
          }
        } else {
          // 未達上限：所有非隊長的項目皆可自由勾選
          cb.disabled = false;
          if (label) {
            label.style.opacity = '1';
            label.style.cursor = 'pointer';
          }
        }
      });
    }

    // 取得儲存的玩家排序
    function getPlayerOrder() {
      const saved = localStorage.getItem("player_custom_order");
      return saved ? JSON.parse(saved) : [];
    }

    // 儲存玩家排序至 LocalStorage
    function savePlayerOrder(orderArray) {
      localStorage.setItem("player_custom_order", JSON.stringify(orderArray));
    }

    // 取得使用者自己存下來的常用 emoji（額外加進頭像面板的預設清單）
    function getCustomAvatarEmojis() {
      const saved = localStorage.getItem("custom_avatar_emojis");
      return saved ? JSON.parse(saved) : [];
    }

    // 把一個新的 emoji 加進使用者自訂的常用清單（去重複，不會塞進已經有的）
    function addCustomAvatarEmoji(emoji) {
      const custom = getCustomAvatarEmojis();
      if (DEFAULT_AVATAR_EMOJIS.includes(emoji) || custom.includes(emoji)) return;
      custom.push(emoji);
      localStorage.setItem("custom_avatar_emojis", JSON.stringify(custom));
    }

    // 取得指定玩家底下的角色自訂排序
    function getCharacterOrder(playerName) {
      const saved = localStorage.getItem(`character_custom_order_${playerName}`);
      return saved ? JSON.parse(saved) : [];
    }

    // 儲存指定玩家底下的角色排序至 LocalStorage
    function saveCharacterOrder(playerName, orderArray) {
      localStorage.setItem(`character_custom_order_${playerName}`, JSON.stringify(orderArray));
    }

    // 取得目前收合中的玩家區塊清單（用玩家名稱 / "guests" 當 key，不用位置索引，避免排序變動後對錯人）
    function getCollapsedPlayerKeys() {
      const saved = localStorage.getItem("collapsed_player_cards");
      if (saved === null) {
        // 從未存過：維持原本的預設行為，Guest 區塊預設收合，其餘玩家預設展開
        return ["guests"];
      }
      return JSON.parse(saved);
    }

    // 儲存目前收合中的玩家區塊清單至 LocalStorage
    function saveCollapsedPlayerKeys(keysArray) {
      localStorage.setItem("collapsed_player_cards", JSON.stringify(keysArray));
    }

    // 初始化拖曳事件 (使用 Event Delegation，同時支援玩家排序與角色排序)
    function initDragAndDrop() {
      const container = document.getElementById("characterList");
      if (!container || container.dataset.dragInited) return;

      let draggedCard = null;
      let draggedType = null; // "player" | "character"

      container.addEventListener("dragstart", (e) => {
        // 避免點擊按鈕或輸入框時觸發拖曳
        if (['BUTTON', 'INPUT', 'SELECT', 'OPTION'].includes(e.target.tagName)) {
          e.preventDefault();
          return;
        }

        // 優先判斷是否拖的是角色卡（角色卡巢狀在玩家卡裡面，需先比對較內層的元素）
        const charCard = e.target.closest(".character-card");
        if (charCard) {
          draggedCard = charCard;
          draggedType = "character";
          charCard.classList.add("dragging");
          e.dataTransfer.effectAllowed = "move";
          e.dataTransfer.setData("text/plain", "character-card"); // 部分瀏覽器(如Firefox)要求dragstart時要有資料，否則drop事件可能收不到
          return;
        }

        const playerCard = e.target.closest(".player-card");
        if (!playerCard) return;

        draggedCard = playerCard;
        draggedType = "player";
        playerCard.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", "player-card");
      });

      container.addEventListener("dragend", () => {
        if (draggedCard) draggedCard.classList.remove("dragging");
        draggedCard = null;
        draggedType = null;
      });

      // dragenter 也要 preventDefault，只擋 dragover 在部分瀏覽器(尤其本機 file:// 環境)不夠穩定，
      // 沒擋住的話瀏覽器可能會判定為不可放置，改成執行「開啟檔案/連結」的預設行為，導致畫面卡住
      container.addEventListener("dragenter", (e) => {
        e.preventDefault();
      });

      container.addEventListener("dragover", (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";

        if (draggedType === "character") {
          const targetCard = e.target.closest(".character-card");
          if (!targetCard || targetCard === draggedCard) return;
          // 限制只能在同一位玩家的角色清單內排序，避免拖曳到其他玩家底下
          if (targetCard.parentElement !== draggedCard.parentElement) return;

          const rect = targetCard.getBoundingClientRect();
          const next = (e.clientY - rect.top) / (rect.bottom - rect.top) > 0.5;
          targetCard.parentElement.insertBefore(draggedCard, next ? targetCard.nextSibling : targetCard);
          return;
        }

        if (draggedType === "player") {
          const targetCard = e.target.closest(".player-card");
          if (!targetCard || targetCard === draggedCard) return;

          const rect = targetCard.getBoundingClientRect();
          const next = (e.clientY - rect.top) / (rect.bottom - rect.top) > 0.5;
          container.insertBefore(draggedCard, next ? targetCard.nextSibling : targetCard);
        }
      });

      container.addEventListener("drop", (e) => {
        e.preventDefault();

        if (draggedType === "character" && draggedCard) {
          persistCharacterOrder(draggedCard);
          return;
        }

        if (draggedType === "player") {
          persistPlayerOrder();
        }
      });

      // 依目前 DOM 順序儲存「角色卡」排序 (同一位玩家底下)
      function persistCharacterOrder(cardEl) {
        const playerName = cardEl.dataset.playerName;
        const parentContainer = cardEl.parentElement;
        const newOrder = Array.from(parentContainer.querySelectorAll(".character-card"))
          .map(card => card.dataset.charId)
          .filter(Boolean);
        saveCharacterOrder(playerName, newOrder);
      }

      // 依目前 DOM 順序儲存「玩家卡」排序
      function persistPlayerOrder() {
        const cards = container.querySelectorAll(".player-card");
        const newOrder = Array.from(cards)
          .map(card => card.dataset.playerName)
          .filter(Boolean);
        savePlayerOrder(newOrder);
      }

      container.dataset.dragInited = "true"; // 避免重複繫結

      // 保險機制：擋掉整個視窗的預設拖放行為，避免手滑拖出容器範圍外時
      // 瀏覽器觸發「開啟檔案/連結」的預設動作（本機 file:// 環境下特別容易導致頁面卡住）
      if (!window.__dragDropWindowGuardInited) {
        window.addEventListener("dragover", (e) => e.preventDefault());
        window.addEventListener("drop", (e) => e.preventDefault());
        window.__dragDropWindowGuardInited = true;
      }
    }

    // 計算距離每週四 00:00 的倒數計時 (精確至分鐘，格式為天 時 分)
    function updateResetTimer() {
      const timerEl = document.getElementById("reset-timer");
      if (!timerEl) return;

      const now = new Date();
      const day = now.getDay(); // 0 = 週日, 4 = 週四
      
      // 計算距離下個週四的天數
      let daysUntilThursday = (4 - day + 7) % 7;
      // 若今天是週四，且已經超過 00:00，則強制倒數下週四
      if (daysUntilThursday === 0 && (now.getHours() > 0 || now.getMinutes() > 0)) {
          daysUntilThursday = 7;
      }

      // 設定下一個重置時間點
      let nextThursday = new Date();
      nextThursday.setDate(now.getDate() + daysUntilThursday);
      nextThursday.setHours(0, 0, 0, 0);

      const diff = nextThursday - now;

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));

      // 顯示格式：天 時 分
      timerEl.innerText = `⏳ 距離重置：${days}天 ${hours}時 ${minutes}分`;
    }

    // 每 60 秒偵測一次是否已經跨過週四重置點，讓頁面開著也能自動刷新，不用手動重新整理
    function checkWeeklyResetPeriodically() {
      if (checkAndPerformWeeklyReset()) {
        saveStoreToCloud();
        renderApp();
      }
    }

    // 每 60 秒更新一次
    setInterval(() => {
      updateResetTimer();
      checkWeeklyResetPeriodically();
    }, 60000);
  </script>

  </div>

  <!-- 編輯角色名稱 Modal -->
  <div id="renameCharModal" class="modal" onclick="handleOverlayClick(event, closeRenameCharModal)">
    <div class="modal-content" style="max-width: 360px; text-align: left;">
      <h3 style="margin-top: 0; margin-bottom: 16px;">🖊️ 修改角色名稱</h3>
      <div style="margin-bottom: 16px;">
        <label style="display: block; font-weight: bold; margin-bottom: 6px; font-size: 14px;">新角色名稱：</label>
        <input type="text" id="renameCharInput"
               style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid var(--border-color); font-size: 14px; box-sizing: border-box; background: var(--input-bg); color: var(--text-main);"
               onkeypress="if(event.key==='Enter') submitRenameChar()" />
      </div>
      <div style="display: flex; justify-content: flex-end; gap: 8px;">
        <button class="btn btn-secondary" onclick="closeRenameCharModal()">取消</button>
        <button class="btn" onclick="submitRenameChar()">儲存名稱</button>
      </div>
    </div>
  </div>

  <!-- 艾里溫碎片：份數選擇 Modal -->
  <div id="shardShareModal" class="modal">
    <div class="modal-content" style="max-width: 420px; text-align: left;">
      <h3 id="shardShareTitle" style="margin-top: 0; margin-bottom: 8px; font-size: 16px;">🔹 分配這次撿取的艾里溫碎片份數</h3>
      <div id="shardShareOptions" class="shard-share-options"></div>
      <div style="display: flex; justify-content: flex-end; gap: 8px;">
        <button class="btn btn-secondary" onclick="closeShardShareModal()">取消</button>
        <button class="btn" id="shardConfirmBtn" onclick="confirmShardShare()">確定</button>
      </div>
    </div>
  </div>

  <!-- 個人化 Windows 出團提醒設定 Modal -->
  <div id="notificationModal" class="modal" onclick="handleOverlayClick(event, closeNotificationModal)">
    <div class="modal-content" style="max-width: 480px; text-align: left;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <h3 style="margin: 0; font-size: 16px; display: flex; align-items: center; gap: 6px;">🔔 Windows 出團推播提醒</h3>
        <button class="btn btn-secondary" style="padding: 2px 8px; font-size: 12px;" onclick="closeNotificationModal()">✕</button>
      </div>
      <p style="font-size: 12px; color: var(--text-muted); margin-top: 0; margin-bottom: 14px; line-height: 1.5;">
        只要瀏覽器開著（即使最小化或在背景玩遊戲），系統會在出團前透過 Windows 原生通知橫幅與鈴聲提醒您。此設定僅儲存於此裝置，不會打擾其他隊友。
      </p>

      <div style="background: var(--bg-hover); padding: 12px 14px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 14px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <div>
            <div style="font-weight: bold; font-size: 14px;">啟用 Windows 系統推播提醒</div>
            <div id="notifPermissionStatus" style="font-size: 11px; color: var(--text-muted); margin-top: 2px;">未啟用</div>
          </div>
          <label class="notif-switch">
            <input type="checkbox" id="notifEnabledToggle" onchange="handleNotificationToggle(this.checked)">
            <span class="notif-slider"></span>
          </label>
        </div>
      </div>

      <div id="notifDetailSettings" style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <label style="font-size: 13px; font-weight: bold;">提前提醒時機：</label>
          <select id="notifLeadTimeSelect" onchange="saveNotificationPreferences()" style="padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border-color); font-size: 13px;">
            <option value="0">準時出團當下</option>
            <option value="5">出團前 5 分鐘</option>
            <option value="10">出團前 10 分鐘</option>
            <option value="15" selected>出團前 15 分鐘（推薦）</option>
            <option value="30">出團前 30 分鐘</option>
            <option value="60">出團前 1 小時</option>
          </select>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center;">
          <label style="font-size: 13px; font-weight: bold;">提示音效：</label>
          <label style="font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer;">
            <input type="checkbox" id="notifSoundToggle" onchange="saveNotificationPreferences()" checked>
            播放水晶提示音
          </label>
        </div>

        <div>
          <label style="font-size: 13px; font-weight: bold; display: block; margin-bottom: 6px;">提醒範圍：</label>
          <div style="display: flex; flex-direction: column; gap: 6px; font-size: 13px;">
            <label style="cursor: pointer; display: flex; align-items: center; gap: 6px;">
              <input type="radio" name="notifScope" value="primary" onchange="saveNotificationPreferences()" checked>
              ⭐ 僅提醒我的角色（主要玩家）有參加的隊伍
            </label>
            <label style="cursor: pointer; display: flex; align-items: center; gap: 6px;">
              <input type="radio" name="notifScope" value="all" onchange="saveNotificationPreferences()">
              🌐 提醒全體所有排定的隊伍
            </label>
          </div>
        </div>

        <div style="display: flex; justify-content: flex-end; margin-top: 4px;">
          <button class="btn btn-secondary" style="font-size: 12px; padding: 5px 12px;" onclick="testSendNotification()">🔔 測試發送推播與音效</button>
        </div>
      </div>

      <div style="border-top: 1px solid var(--border-color); padding-top: 12px;">
        <div style="font-weight: bold; font-size: 13px; margin-bottom: 8px;">📅 本週已排程隊伍總覽：</div>
        <div id="notifScheduleList" style="max-height: 160px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; font-size: 12px;">
          <!-- 動態渲染本週所有排程隊伍 -->
        </div>
      </div>

      <div style="display: flex; justify-content: flex-end; margin-top: 16px;">
        <button class="btn" onclick="closeNotificationModal()">完成</button>
      </div>
    </div>
  </div>

  <script>
    // 背景頁面捲動鎖定：只要任何 .modal 被打開（display 不是 none），就鎖住 <body> 的捲動，
    // 避免 modal 內部捲到底時，捲動事件「溢出」去捲動背景的大畫面
    (function setupModalScrollLock() {
      function isAnyModalOpen() {
        return Array.from(document.querySelectorAll(".modal")).some(m => {
          const displayValue = m.style.display || getComputedStyle(m).display;
          return displayValue && displayValue !== "none";
        });
      }

      function updateBodyScrollLock() {
        document.body.classList.toggle("modal-open-lock", isAnyModalOpen());
      }

      const observer = new MutationObserver(updateBodyScrollLock);
      observer.observe(document.body, { attributes: true, attributeFilter: ["style"], subtree: true });

      updateBodyScrollLock();
    })();
  </script>

</body>
</html>
