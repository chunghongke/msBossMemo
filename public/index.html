  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC6_PrlBgVTbmpDCrWP7KMTAq8RHtNsI-M",
      authDomain: "msbossmemo-752e3.firebaseapp.com",
      databaseURL: "https://msbossmemo-752e3-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "msbossmemo-752e3",
      storageBucket: "msbossmemo-752e3.firebasestorage.app",
      messagingSenderId: "747420574318",
      appId: "1:747420574318:web:eff8bdb117a776264cfc7f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.db = db;
    window.dbRef = ref;
    window.dbSet = set;

    window.config = { bosses: [], players: [] };
    window.store = { teams: {}, weeklyRecords: {} };

    const rootRef = ref(db, '/');
    onValue(rootRef, (snapshot) => {
      const data = snapshot.val();
      
      if (data) {
        // 💡 修復：過濾 Firebase 產生的 null 空洞，並防範陣列轉 Object
        let rawBosses = data.bosses || [];
        if (!Array.isArray(rawBosses)) {
          rawBosses = Object.values(rawBosses);
        }
        // 把 null 跟 undefined 濾掉
        window.config.bosses = rawBosses.filter(b => b !== null && b !== undefined);

        // 順便把 players 也加上同樣的安全防護（預防以後你也手動刪除玩家）
        let rawPlayers = data.players || [];
        if (!Array.isArray(rawPlayers)) {
          rawPlayers = Object.values(rawPlayers);
        }
        window.config.players = rawPlayers.filter(p => p !== null && p !== undefined);

        window.store = data.store || { teams: {}, weeklyRecords: {}, guests: [] };
        if (!window.store.guests) window.store.guests = [];
      }

      const weeklyResetHappened = checkAndPerformWeeklyReset();
      ensureDefaultSingleTeams();
      if (weeklyResetHappened) saveStoreToCloud();
      renderApp();
    });

    let currentEditingCharId = null;

    window.openEditCharBossesModal = function(charId) {
      currentEditingCharId = charId;
      const modal = document.getElementById("editCharBossesModal");
      const titleEl = document.getElementById("editCharTitle");
      const bossListContainer = document.getElementById("editCharBossList");

      if (!modal || !bossListContainer) return;

      let targetChar = null;
      if (window.config.players) {
        for (const player of window.config.players) {
          if (player.characters) {
            const found = player.characters.find(c => c.id === charId);
            if (found) {
              targetChar = found;
              break;
            }
          }
        }
      }

      if (!targetChar) {
        alert("找不到該角色資料！");
        return;
      }

      titleEl.innerText = `✏️ 編輯 ${targetChar.name} 的 BOSS 清單`;

      // 💡 這個角色如果已經有設定重置券（resetBossIds），那些名額也要算進 12 隻上限，
      //    不然這裡選滿 12 隻、加上原本的重置券，實際總數會超過 12
      const reservedCount = targetChar.resetBossIds ? targetChar.resetBossIds.length : 0;

      bossListContainer.innerHTML = "";
      if (window.config.bosses && Array.isArray(window.config.bosses)) {
        window.config.bosses.forEach(boss => {
          const isChecked = targetChar.bossIds && targetChar.bossIds.includes(boss.id);
          bossListContainer.innerHTML += `
            <label style="font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer; color: #334155 !important;">
              <input type="checkbox" class="edit-char-boss-checkbox" value="${boss.id}" ${isChecked ? 'checked' : ''} onchange="handleCharBossCheckboxLimit(this, '.edit-char-boss-checkbox', 'editCharBossCount', ${reservedCount})" />
              ${boss.name}
            </label>
          `;
        });
      }
      updateCharBossCountDisplay('.edit-char-boss-checkbox', 'editCharBossCount', reservedCount);

      modal.style.display = "flex";
    };

    window.handleCharBossCheckboxLimit = function(checkbox, selector, countSpanId, reservedCount) {
      reservedCount = reservedCount || 0;
      const checked = document.querySelectorAll(`${selector}:checked`);
      if (checked.length + reservedCount > 12) {
        const reservedNote = reservedCount > 0 ? `（含已設定重置券的 ${reservedCount} 隻）` : "";
        alert(`最多只能選擇 12 隻 BOSS！${reservedNote}`);
        checkbox.checked = false;
      }
      updateCharBossCountDisplay(selector, countSpanId, reservedCount);
    };

    window.updateCharBossCountDisplay = function(selector, countSpanId, reservedCount) {
      reservedCount = reservedCount || 0;
      const span = document.getElementById(countSpanId);
      if (!span) return;
      const checkedCount = document.querySelectorAll(`${selector}:checked`).length;
      const totalCount = checkedCount + reservedCount;
      const reservedNote = reservedCount > 0 ? `，含重置券 ${reservedCount}` : "";
      span.innerText = `(已選 ${checkedCount} / 12${reservedNote})`;
      if (totalCount >= 12) {
        span.style.color = '#e11d48';
      } else {
        span.style.color = '#64748b';
      }
    };

    window.closeEditCharBossesModal = function() {
      const modal = document.getElementById("editCharBossesModal");
      if (modal) modal.style.display = "none";
      currentEditingCharId = null;
    };

    window.saveEditCharBosses = function() {
      if (!currentEditingCharId) return;

      const selectedBossIds = [];
      const checkboxes = document.querySelectorAll(".edit-char-boss-checkbox:checked");
      checkboxes.forEach(cb => selectedBossIds.push(cb.value));

      // 先找到角色本人，才能算入既有的重置券數量
      let targetChar = null;
      if (window.config.players) {
        for (const player of window.config.players) {
          if (player.characters) {
            const found = player.characters.find(c => c.id === currentEditingCharId);
            if (found) {
              targetChar = found;
              break;
            }
          }
        }
      }

      // 💡 12 隻上限要把已經設定的重置券（resetBossIds）也算進去，不然這裡選滿 12 隻、
      //    加上原本的重置券，實際總數會超過 12（跟畫面上的即時檢查邏輯保持一致）
      const reservedCount = targetChar && targetChar.resetBossIds ? targetChar.resetBossIds.length : 0;
      if (selectedBossIds.length + reservedCount > 12) {
        const reservedNote = reservedCount > 0 ? `（含已設定重置券的 ${reservedCount} 隻）` : "";
        alert(`最多只能選擇 12 隻 BOSS！${reservedNote}(目前勾選了 ${selectedBossIds.length} 隻)`);
        return;
      }

      let updated = false;
      if (targetChar) {
        targetChar.bossIds = selectedBossIds;

        if (targetChar.resetBossIds) {
          // 💡 重置券可能是「跳難度」設定的（reset boss id 不在 bossIds 裡，例如困難->極限）
          //    只要該重置目標所屬的 BOSS 群組，角色還有排定任一難度，就保留；群組整個被移除才清掉
          const selectedGroupKeys = new Set(selectedBossIds.map(bId => getBossGroupKey(bId)));
          targetChar.resetBossIds = targetChar.resetBossIds.filter(bId => selectedGroupKeys.has(getBossGroupKey(bId)));
        }

        updated = true;
      }

      if (!updated) {
        alert("更新失敗，找不到該角色！");
        return;
      }

      if (window.db && window.dbRef && window.dbSet) {
        const playersRef = window.dbRef(window.db, 'players');
        
        window.dbSet(playersRef, window.config.players)
          .then(() => {
            alert("BOSS 清單更新成功！");
            window.closeEditCharBossesModal();
          })
          .catch(err => {
            console.error("Firebase 寫入失敗：", err);
            alert("更新失敗，請檢查權限或網路。");
          });
      }
    };
  </script>

  <script>
  function saveStoreToCloud() {
    if (window.db && window.dbRef && window.dbSet) {
      const storeRef = window.dbRef(window.db, '/store');
      window.dbSet(storeRef, window.store)
        .then(() => console.log("☁️ 雲端同步成功！"))
        .catch((err) => console.error("❌ 雲端同步失敗:", err));
    }
  }

  function getAllCharacters() {
    const chars = [];
    if (!window.config.players) return chars;
    window.config.players.forEach(p => {
      if (p.characters) {
        p.characters.forEach(c => {
          chars.push({ ...c, playerName: p.name });
        });
      }
    });
    return chars;
  }

  function getCharName(charId) {
    const chars = getAllCharacters();
    const c = chars.find(item => item.id === charId);
    if (c) return c.name;
    if (window.store && window.store.guests) {
      const guest = window.store.guests.find(g => g.id === charId);
      if (guest) return `${guest.name} (G)`;
    }
    return charId;
  }

  // 依照 boss id 常見的難度後綴，算出「群組 key」，例如 kalos_hard / kalos_extreme 都屬於 "kalos" 群組
  const BOSS_DIFFICULTY_SUFFIXES = ["_easy", "_normal", "_hard", "_extreme"];
  function getBossGroupKey(bossId) {
    for (const suffix of BOSS_DIFFICULTY_SUFFIXES) {
      if (bossId.endsWith(suffix)) return bossId.slice(0, -suffix.length);
    }
    return bossId; // 沒有符合已知難度後綴的，自成一群
  }

  // 算出「目前這一週」的識別 key，用最近一次週四 00:00（本地時間）當基準，格式 YYYY-MM-DD
  // 這個 key 在同一週內（週四到下週三）都會是同一個值，跨過週四 00:00 就會變成新的值
  function getCurrentResetWeekKey() {
    const now = new Date();
    const day = now.getDay(); // 0=週日 ... 4=週四 ... 6=週六
    const daysSinceThursday = (day - 4 + 7) % 7;
    const lastThursday = new Date(now);
    lastThursday.setDate(now.getDate() - daysSinceThursday);
    lastThursday.setHours(0, 0, 0, 0);

    const y = lastThursday.getFullYear();
    const m = String(lastThursday.getMonth() + 1).padStart(2, "0");
    const d = String(lastThursday.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  }

  // 偵測是否已經跨過週四重置點：跨了就把「完成狀態」打回未完成，但保留隊伍的指向關係，
  // 這樣隊伍名單會自動延續到下一週，不用每週重組。（team id 已改成不含時間戳記的固定值，
  // 同一批隊員不會每週疊出一筆新資料，不會有幽靈隊伍問題）
  function checkAndPerformWeeklyReset() {
    const currentWeekKey = getCurrentResetWeekKey();

    if (!window.store.lastResetWeekKey) {
      // 第一次套用這個機制：只記錄基準週，不動既有資料，避免部署當下就把當週資料洗掉
      window.store.lastResetWeekKey = currentWeekKey;
      return true;
    }

    if (window.store.lastResetWeekKey !== currentWeekKey) {
      if (window.store.weeklyRecords) {
        Object.values(window.store.weeklyRecords).forEach(rec => {
          if (!rec) return;
          // 💡 艾里溫碎片：如果上週有完成且有選份數（包含選 0 份），先存成 lastWeekShardShares 當提示，
          // 再把本週的選擇清空，讓這週要重新選一次（避免沿用上週的份數造成誤判）
          if (rec.isCompleted && rec.shardShares !== null && rec.shardShares !== undefined) {
            rec.lastWeekShardShares = rec.shardShares;
          }
          rec.shardShares = null;
          rec.isCompleted = false;
        });
      }
      // 💡 隊伍出團時間：新的一週到來時，自動清除所有隊伍的「本週臨時時間」，恢復為常態時間
      if (window.store.teams) {
        Object.values(window.store.teams).forEach(t => {
          if (t && t.schedule && t.schedule.tempOverride && t.schedule.tempOverride.weekKey !== currentWeekKey) {
            t.schedule.tempOverride = null;
          }
        });
      }
      window.store.lastResetWeekKey = currentWeekKey;
      console.log(`🗓️ 偵測到新的一週（${currentWeekKey}），已將所有 BOSS 完成狀態重置為未完成（隊伍名單保留，臨時時間已恢復常態）`);
      return true;
    }

    return false;
  }

  function ensureDefaultSingleTeams() {
    const allChars = getAllCharacters();
    let updated = false;

    if (!window.config.bosses || window.config.bosses.length === 0) return;

    window.config.bosses.forEach(boss => {
      const maxEntries = boss.allowReset ? 2 : 1;
      for (let entry = 1; entry <= maxEntries; entry++) {
        allChars.forEach(c => {
          // entry 1（首次刷）只有角色本來排定要打的 BOSS 才建立紀錄，不是每隻 BOSS 都要建
          const hasBossAssigned = !c.bossIds || c.bossIds.length === 0 || c.bossIds.includes(boss.id);
          if (entry === 1 && !hasBossAssigned) {
            return;
          }

          if (entry === 2 && (!c.resetBossIds || !c.resetBossIds.includes(boss.id))) {
            return;
          }

          const defaultTeamId = `single_${c.id}_${boss.id}_${entry}`;
          const recordKey = `rec_${c.id}_${boss.id}_${entry}`;

          if (!window.store.weeklyRecords) window.store.weeklyRecords = {};
          if (!window.store.teams) window.store.teams = {};

          if (!window.store.weeklyRecords[recordKey]) {
            window.store.teams[defaultTeamId] = {
              id: defaultTeamId,
              memberTargets: [{ charId: c.id, entryIndex: entry }]
            };
            window.store.weeklyRecords[recordKey] = {
              charId: c.id,
              bossId: boss.id,
              entryIndex: entry,
              teamId: defaultTeamId,
              isCompleted: false
            };
            updated = true;
          } else if (!window.store.weeklyRecords[recordKey].charId) {
            // 💡 資料搬遷：舊資料沒有 charId 欄位，這裡本來就已經知道正確的 c.id 是誰，直接補上，不需要用字串猜
            window.store.weeklyRecords[recordKey].charId = c.id;
            updated = true;
          }
        });
      }
    });

    if (updated) {
      saveStoreToCloud();
    }
  }

  function getCharacterCompletedCount(charId) {
    let count = 0;
    if (!window.store.weeklyRecords) return 0;
    
    Object.values(window.store.weeklyRecords).forEach(record => {
      if (record && record.charId === charId && record.isCompleted) {
        count++;
      }
    });
    return count;
  }

  // 找出角色「本週已完成，但已經被移出 BOSS 清單」的紀錄（只顯示、不可再互動切換）
  function getRemovedCompletedBosses(c) {
    const removed = [];
    if (!window.store.weeklyRecords) return removed;

    Object.values(window.store.weeklyRecords).forEach(record => {
      if (!record || record.charId !== c.id || !record.isCompleted) return;

      const stillAssigned = record.entryIndex === 2
        ? (c.resetBossIds && c.resetBossIds.includes(record.bossId))
        : (!c.bossIds || c.bossIds.length === 0 || c.bossIds.includes(record.bossId));

      if (stillAssigned) return;

      const boss = window.config.bosses.find(b => b.id === record.bossId);
      if (!boss) return;

      removed.push(record.entryIndex === 2 ? `${boss.name}(重置)` : boss.name);
    });

    return removed;
  }

  // 把原始結晶錢數值格式化成「萬」，保留一位小數（例：3333333 -> "333.3萬"）
  // 把原始結晶錢數值格式化成「億萬」，超過 1 億會拆成 X億Y.Y萬，沒到 1 億就只顯示 Y.Y萬
  function formatCrystal(rawValue) {
    const manValue = rawValue / 10000; // 換算成「萬」為單位
    const yi = Math.floor(manValue / 10000);
    const remainderMan = manValue - yi * 10000;

    if (yi > 0) {
      return `${yi}億${remainderMan.toFixed(1)}萬`;
    }
    return `${manValue.toFixed(1)}萬`;
  }

  // 計算角色本週的結晶錢：已收入（只算完成的）、預計收入（不管完成與否，全部排定的都算）
  // 邏輯跟角色卡片實際渲染 boss-cell 的判斷條件完全一致，確保數字跟畫面上顯示的格子永遠對得上
  function calculateCharacterCrystal(c) {
    let earned = 0;
    let expected = 0;

    window.config.bosses.forEach(boss => {
      if (!boss.crystalValue) return;

      const inBossIds = !c.bossIds || c.bossIds.length === 0 || c.bossIds.includes(boss.id);
      const inResetBossIds = c.resetBossIds && c.resetBossIds.includes(boss.id);
      if (!inBossIds && !inResetBossIds) return;

      const maxEntries = boss.allowReset ? 2 : 1;

      for (let entry = 1; entry <= maxEntries; entry++) {
        if (entry === 1 && !inBossIds) continue;
        if (entry === 2 && !inResetBossIds) continue;

        const recordKey = `rec_${c.id}_${boss.id}_${entry}`;
        const record = window.store.weeklyRecords ? window.store.weeklyRecords[recordKey] : null;
        const team = record && window.store.teams ? window.store.teams[record.teamId] : null;
        if (!record || !team) continue;

        const rawMembers = team.memberTargets || (team.memberCharIds || []).map(id => ({ charId: id, entryIndex: entry }));
        // Guest 也算一份，均分人數用實際還存在的隊員數（跟畫面上「隊伍成員」顯示邏輯一致）
        const validMembers = rawMembers.filter(m => {
          if (!m.charId.startsWith("guest_")) return true;
          return window.store.guests && window.store.guests.some(g => g.id === m.charId);
        });

        const teamSize = validMembers.length > 0 ? validMembers.length : 1;
        const share = boss.crystalValue / teamSize;

        expected += share;
        if (record.isCompleted) earned += share;
      }
    });

    return { earned, expected };
  }

  // 把艾里溫碎片數量格式化成整數（碎片數量通常不大，不需要像結晶錢那樣換算成萬/億）
  function formatShardNumber(rawValue) {
    return Math.round(rawValue).toLocaleString("zh-TW");
  }

  // 計算角色本週的艾里溫碎片：
  // - 碎片的「每份」固定是 boss.erionVestiges / boss.maxPartySize（跟實際到場人數無關，是 BOSS 固定掉落的份數）
  // - 單人隊伍（實際到場只有自己）：視為撿走全部（maxPartySize 份），跟結晶錢一樣自動算滿額
  // - 多人隊伍：預計金額固定用「1 份」當基準（因為實際會撿幾份要等使用者手動選擇），
  //   已完成的部分則改用使用者實際選擇的份數（record.shardShares），還沒選就先當 1 份
  function calculateCharacterShard(c) {
    let earned = 0;
    let expected = 0;

    window.config.bosses.forEach(boss => {
      if (!boss.erionVestiges) return;

      const inBossIds = !c.bossIds || c.bossIds.length === 0 || c.bossIds.includes(boss.id);
      const inResetBossIds = c.resetBossIds && c.resetBossIds.includes(boss.id);
      if (!inBossIds && !inResetBossIds) return;

      const maxEntries = boss.allowReset ? 2 : 1;
      const maxPartySize = boss.maxPartySize || 1;
      const unitShare = boss.erionVestiges / maxPartySize;

      for (let entry = 1; entry <= maxEntries; entry++) {
        if (entry === 1 && !inBossIds) continue;
        if (entry === 2 && !inResetBossIds) continue;

        const recordKey = `rec_${c.id}_${boss.id}_${entry}`;
        const record = window.store.weeklyRecords ? window.store.weeklyRecords[recordKey] : null;
        const team = record && window.store.teams ? window.store.teams[record.teamId] : null;
        if (!record || !team) continue;

        const rawMembers = team.memberTargets || (team.memberCharIds || []).map(id => ({ charId: id, entryIndex: entry }));
        const validMembers = rawMembers.filter(m => {
          if (!m.charId.startsWith("guest_")) return true;
          return window.store.guests && window.store.guests.some(g => g.id === m.charId);
        });

        const isSolo = validMembers.length <= 1;

        expected += isSolo ? boss.erionVestiges : unitShare;

        if (record.isCompleted) {
          const hasChosen = record.shardShares !== null && record.shardShares !== undefined;
          const shares = isSolo ? maxPartySize : (hasChosen ? record.shardShares : 1);
          earned += unitShare * shares;
        }
      }
    });

    return { earned, expected };
  }

  // 記錄目前每個 boss-cell 的畫面位置（key 為 recordKey），供重繪後做滑動動畫比對用
  function captureBossCellPositions(container) {
    const positions = new Map();
    container.querySelectorAll(".boss-cell[data-record-key]").forEach(cell => {
      positions.set(cell.dataset.recordKey, cell.getBoundingClientRect());
    });
    return positions;
  }

  // FLIP 動畫：比對重繪前後的位置差異，用 transform 讓卡片「滑」到新位置，而不是瞬間跳過去
  function playBossCellReorderAnimation(container, oldPositions) {
    if (!oldPositions || oldPositions.size === 0) return;

    container.querySelectorAll(".boss-cell[data-record-key]").forEach(cell => {
      const key = cell.dataset.recordKey;
      const oldRect = oldPositions.get(key);
      if (!oldRect) return;

      const newRect = cell.getBoundingClientRect();
      const dx = oldRect.left - newRect.left;
      const dy = oldRect.top - newRect.top;

      if (dx === 0 && dy === 0) return;

      cell.style.transition = "none";
      cell.style.transform = `translate(${dx}px, ${dy}px)`;

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          cell.style.transition = "transform 0.3s ease";
          cell.style.transform = "";
        });
      });

      cell.addEventListener("transitionend", function cleanup() {
        cell.style.transition = "";
        cell.removeEventListener("transitionend", cleanup);
      });
    });
  }

  function renderApp() {
    updateUserSelectOptions();

    const container = document.getElementById("characterList");
    if (!container) return;

    const oldBossCellPositions = captureBossCellPositions(container);

    container.innerHTML = "";

    if (!window.config.players || !Array.isArray(window.config.players) || window.config.players.length === 0) {
      container.innerHTML = `<div style="text-align:center; padding: 40px; color: #64748b;">⚠️ 未讀取到玩家設定檔</div>`;
      return;
    }

    const primaryUser = getPrimaryUser();
    const savedOrder = getPlayerOrder();
    const collapsedKeys = getCollapsedPlayerKeys();

    // 排序邏輯：指定主要玩家置頂，其餘依照 localStorage 拖曳順序排列
    const sortedPlayers = [...window.config.players].sort((a, b) => {
      if (a.name === primaryUser) return -1;
      if (b.name === primaryUser) return 1;

      const indexA = savedOrder.indexOf(a.name);
      const indexB = savedOrder.indexOf(b.name);

      if (indexA !== -1 && indexB !== -1) return indexA - indexB;
      if (indexA !== -1) return -1;
      if (indexB !== -1) return 1;
      return 0;
    });

    sortedPlayers.forEach((p, pIdx) => {
      const playerId = `p_${pIdx}`;
      const isPrimary = p.name === primaryUser;
      const isCollapsed = collapsedKeys.includes(p.name);

      // 💡 關鍵修復：Firebase 取回的空陣列會變成 undefined，在此加上空值保護
      const rawCharacters = p.characters || [];

      // 依照該玩家儲存的自訂拖曳順序排序角色，未儲存過順序的角色維持原本順序
      const savedCharOrder = getCharacterOrder(p.name);
      const characters = [...rawCharacters].sort((a, b) => {
        const idxA = savedCharOrder.indexOf(a.id);
        const idxB = savedCharOrder.indexOf(b.id);
        if (idxA !== -1 && idxB !== -1) return idxA - idxB;
        if (idxA !== -1) return -1;
        if (idxB !== -1) return 1;
        return 0;
      });

      // 先算出每個角色的結晶錢，順便加總成這個玩家的總計（header 要用到，所以要在 header 組出來之前先算）
      const crystalByCharId = new Map();
      const shardByCharId = new Map();
      let playerEarnedTotal = 0;
      let playerExpectedTotal = 0;
      characters.forEach(c => {
        const crystal = calculateCharacterCrystal(c);
        crystalByCharId.set(c.id, crystal);
        playerEarnedTotal += crystal.earned;
        playerExpectedTotal += crystal.expected;

        shardByCharId.set(c.id, calculateCharacterShard(c));
      });

      let playerHTML = `
        <div class="player-card ${isPrimary ? 'primary-player' : ''} ${isCollapsed ? 'is-collapsed' : ''}" 
            id="player-card-${playerId}" 
            draggable="true" 
            data-player-name="${p.name}"
            data-collapse-key="${p.name}">
          <div class="player-header" onclick="togglePlayerCollapse('${playerId}')">
            <span>
              <span class="player-avatar-btn" onclick="event.stopPropagation(); openAvatarPickerModal('${p.name.replace(/'/g, "\\'")}')" title="點擊更換頭像">${p.avatarEmoji || '👤'}</span>
              玩家：${p.name} ${isPrimary ? ' ⭐ (自己)' : ''}
              ${playerExpectedTotal > 0 ? `<span style="font-size:12px; font-weight:normal; color:#eab308; margin-left:8px; display:inline-flex; align-items:center; gap:2px;"><img class="crystal-icon" src="./crystal-icon.png" alt="結晶" /> ${formatCrystal(playerEarnedTotal)} / ${formatCrystal(playerExpectedTotal)}</span>` : ''}
            </span>
            <span class="collapse-icon" id="collapse-icon-${playerId}">${isCollapsed ? '▲ 展開' : '▼ 收合'}</span>
          </div>
          <div class="player-characters">
      `;

      if (characters.length === 0) {
        playerHTML += `
          <div style="padding: 10px 20px; color: #94a3b8; font-size: 13px; font-style: italic;">
            尚無角色，請點擊上方「➕ 新增角色」來為 ${p.name} 建立角色。
          </div>
        `;
      } else {
        characters.forEach(c => {
          const count = getCharacterCompletedCount(c.id);
          const isFull = count >= 12;
          let selectedBossCount = c.bossIds ? c.bossIds.length : 0;
          selectedBossCount += c.resetBossIds ? c.resetBossIds.length : 0;
          const charCrystal = crystalByCharId.get(c.id) || { earned: 0, expected: 0 };
          const charShard = shardByCharId.get(c.id) || { earned: 0, expected: 0 };

          playerHTML += `
            <div class="character-card" draggable="true" data-char-id="${c.id}" data-player-name="${p.name}">
              <div class="char-header">
                <div class="char-title" style="display: flex; align-items: center; gap: 6px;">
                  ${c.characterImage
                    ? `<span class="char-avatar-wrap">
                        <img class="char-avatar" src="${c.characterImage}?width=100&height=100" alt="${c.name}" loading="lazy" onerror="this.closest('.char-avatar-wrap').outerHTML='⚔️';" />
                        <img class="char-avatar-preview" src="${c.characterImage}?width=320&height=320" alt="${c.name}" loading="lazy" />
                      </span>`
                    : '⚔️'}
                  ${c.name}
                  <button class="btn-icon" 
                          onclick="event.stopPropagation(); openEditCharBossesModal('${c.id}')" 
                          title="編輯角色的 BOSS 清單"
                          style="background: transparent; border: none; cursor: pointer; padding: 2px 4px; font-size: 12px; color: #64748b; border-radius: 4px; line-height: 1;"
                          onmouseover="this.style.background='#e2e8f0'" 
                          onmouseout="this.style.background='transparent'">
                    ✏️
                  </button>
                  <button class="btn-icon"
                          onclick="event.stopPropagation(); openRenameCharModal('${c.id}', '${c.name.replace(/'/g, "\\'")}')"
                          title="修改角色名稱"
                          style="background: transparent; border: none; cursor: pointer; padding: 2px 4px; font-size: 12px; color: #64748b; border-radius: 4px; line-height: 1;"
                          onmouseover="this.style.background='#e2e8f0'"
                          onmouseout="this.style.background='transparent'">
                    🖊️
                  </button>
                  ${charCrystal.expected > 0 ? `<span style="font-size:11px; color:#eab308; font-weight:normal; display:inline-flex; align-items:center; gap:2px;"><img class="crystal-icon" src="./crystal-icon.png" alt="結晶" /> ${formatCrystal(charCrystal.earned)} / ${formatCrystal(charCrystal.expected)}</span>` : ''}
                  ${charShard.expected > 0 ? `<span style="font-size:11px; color:#0ea5e9; font-weight:normal; display:inline-flex; align-items:center; gap:2px;" title="實際數量依你在多人 BOSS 選擇的撿取份數而定，這裡預計值先以「多人隊伍固定 1 份」估算"><img class="shard-icon" src="./shard-icon.png" alt="碎片" /> ${formatShardNumber(charShard.earned)} / ${formatShardNumber(charShard.expected)} 碎片</span>` : ''}
                </div>
                <span class="char-badge ${isFull ? 'full' : ''}">已完成 ${count} / ${selectedBossCount}</span>
              </div>
              ${(() => {
                const removedCompleted = getRemovedCompletedBosses(c);
                if (removedCompleted.length === 0) return '';
                return `<div class="removed-completed-note" title="這些 BOSS 已經從清單移除，本週完成紀錄仍會計入次數，但不能再切換攻略狀態">
                  🗑️ 已完成但移出清單：${removedCompleted.join('、')}
                </div>`;
              })()}
              <div class="boss-grid">
          `;

          const bossCellEntries = [];

          window.config.bosses.forEach(boss => {
            const inBossIds = !c.bossIds || c.bossIds.length === 0 || c.bossIds.includes(boss.id);
            const inResetBossIds = c.resetBossIds && c.resetBossIds.includes(boss.id);

            // 這個 boss 既不是角色本來排定的難度，也沒有設定重置券打這裡，跟這個角色完全無關，略過
            if (!inBossIds && !inResetBossIds) return;

            const maxEntries = boss.allowReset ? 2 : 1;

            for (let entry = 1; entry <= maxEntries; entry++) {
              if (entry === 1 && !inBossIds) continue;   // entry 1（首次刷）只有角色本來排定的難度才顯示
              if (entry === 2 && !inResetBossIds) continue; // entry 2（重置刷）只有設定重置券打這個難度才顯示

              const recordKey = `rec_${c.id}_${boss.id}_${entry}`;
              const record = window.store.weeklyRecords ? window.store.weeklyRecords[recordKey] : null;
              const team = record && window.store.teams ? window.store.teams[record.teamId] : null;

              if (record && team) {
                const isCompleted = record.isCompleted;
                
                let rawMembers = team.memberTargets || (team.memberCharIds || []).map(id => ({ charId: id, entryIndex: entry }));
                
                const validMembers = rawMembers.filter(m => {
                  if (!m.charId.startsWith("guest_")) return true;
                  return window.store.guests && window.store.guests.some(g => g.id === m.charId);
                });

                const partyMembers = validMembers.filter(m => !(m.charId === c.id && m.entryIndex === entry));

                const allMemberNames = validMembers.map(m => {
                  const name = getCharName(m.charId);
                  return m.entryIndex === 2 ? `${name}(重置)` : name;
                }).join(", ");

                const displayTeamText = partyMembers.length > 0
                  ? partyMembers.map(m => {
                      const name = getCharName(m.charId);
                      return m.entryIndex === 2 ? `${name}(重置)` : name;
                    }).join(", ")
                  : '單人';

                // 判斷這個重置格是不是「跳難度」用的：角色本來排定的難度清單裡沒有這個 boss.id，
                // 代表這個重置券不是同難度多刷一次，而是拿去打了群組裡的另一個難度
                const isCrossDifficultyReset = entry === 2 && c.bossIds && !c.bossIds.includes(boss.id);

                let sourceBossLabel = "";
                if (isCrossDifficultyReset) {
                  const groupKey = getBossGroupKey(boss.id);
                  const sourceBoss = (c.bossIds || [])
                    .map(bId => window.config.bosses.find(b => b.id === bId))
                    .find(b => b && getBossGroupKey(b.id) === groupKey);
                  sourceBossLabel = sourceBoss ? sourceBoss.name : "其他難度";
                }

                const bossDisplayName = entry === 2
                  ? `🎟️ ${boss.name}(重置)`
                  : boss.name;

                const cellTitle = isCrossDifficultyReset
                  ? `隊伍成員: ${allMemberNames} (右鍵可編輯隊伍)\n🎟️ 此次數來自重置券：${sourceBossLabel} → ${boss.name}`
                  : (entry === 2
                    ? `隊伍成員: ${allMemberNames} (右鍵可編輯隊伍)\n🎟️ 此次數來自重置券：${boss.name}(同難度)`
                    : `隊伍成員: ${allMemberNames} (右鍵可編輯隊伍)`);

                // 艾里溫碎片份數標籤：只有這隻 BOSS 有設定 erionVestiges 才顯示
                // - 單人隊伍：固定顯示「滿額/滿額」（例如 6/6），純顯示不可點擊，因為單人自動全拿不用選
                // - 多人隊伍：顯示目前選了幾份，點擊可以打開選擇彈窗（0 份也是合法選項，例如兩人隊伍這週 A 全撿、下週換 B 全撿）
                const maxPartySize = boss.maxPartySize || 1;
                const isSoloTeam = validMembers.length <= 1;
                let shardTagHtml = "";
                if (boss.erionVestiges) {
                  if (isSoloTeam) {
                    shardTagHtml = `
                      <div class="shard-tag static" title="單人隊伍自動全拿">
                        <img class="shard-icon" src="./shard-icon.png" alt="碎片" />${maxPartySize}/${maxPartySize}份
                      </div>
                    `;
                  } else {
                    const hasChosen = record.shardShares !== null && record.shardShares !== undefined;
                    const currentShares = hasChosen ? record.shardShares : "?";
                    shardTagHtml = `
                      <div class="shard-tag ${hasChosen ? '' : 'unpicked'}"
                          onclick="event.stopPropagation(); openShardShareModal('${recordKey}')"
                          title="設定這次撿取的艾里溫碎片份數">
                        <img class="shard-icon" src="./shard-icon.png" alt="碎片" />${currentShares}/${maxPartySize}份
                      </div>
                    `;
                  }
                }

                const effectiveSchedule = getTeamEffectiveSchedule(team);
                let scheduleBadgeHtml = "";
                if (effectiveSchedule) {
                  const scheduleFormatted = formatScheduleDisplay(effectiveSchedule);
                  scheduleBadgeHtml = `
                    <div class="team-schedule-badge ${effectiveSchedule.isTemp ? 'temp' : ''} ${isCompleted ? 'completed' : ''}" title="${effectiveSchedule.isTemp ? '⚡ 本週臨時時間（下週自動恢復）' : '📅 常態固定出團時間'}">
                      ${scheduleFormatted}
                    </div>
                  `;
                }

                bossCellEntries.push({
                  isCompleted,
                  html: `
                  <div class="boss-cell ${isCompleted ? 'completed' : 'not-completed'} ${entry === 2 ? 'cross-diff-reset' : ''}"
                      data-record-key="${recordKey}"
                      onclick="toggleBossStatus('${recordKey}')"
                      oncontextmenu="openPartyModal(event, '${c.id}', '${boss.id}', ${entry})"
                      ontouchstart="handleCellTouchStart(event, '${c.id}', '${boss.id}', ${entry})"
                      ontouchmove="handleCellTouchMove(event)"
                      ontouchend="handleCellTouchEnd(event)"
                      ontouchcancel="handleCellTouchEnd(event)"
                      title="${cellTitle}">
                    ${shardTagHtml}
                    <div class="boss-name">${bossDisplayName}</div>
                    <div class="party-members">${displayTeamText}</div>
                    ${scheduleBadgeHtml}
                  </div>
                `
                });
              }
            }
          });

          // 已完成的 BOSS 排到後面，未完成的排前面；同狀態內維持原本順序
          bossCellEntries
            .sort((a, b) => (a.isCompleted === b.isCompleted) ? 0 : (a.isCompleted ? 1 : -1))
            .forEach(entryItem => { playerHTML += entryItem.html; });

          playerHTML += `
              </div>
            </div>
          `;
        });
      }

      playerHTML += `
          </div>
        </div>
      `;

      container.innerHTML += playerHTML;
    });

    renderGuestSection();
    updateResetTimer();
    initDragAndDrop();
    playBossCellReorderAnimation(container, oldBossCellPositions);
  }

  window.scrollToGuests = function() {
    const guestCard = document.getElementById("player-card-guests");
    const icon = document.getElementById("collapse-icon-guests");
    if (guestCard) {
      guestCard.classList.remove("is-collapsed");
      if (icon) icon.innerText = "▼ 收合";

      const collapsedKeys = getCollapsedPlayerKeys().filter(k => k !== "guests");
      saveCollapsedPlayerKeys(collapsedKeys);

      guestCard.scrollIntoView({ behavior: "smooth" });
    }
  };

  function renderGuestSection() {
    const container = document.getElementById("guestSectionContainer");
    if (!container) return;

    const isCollapsed = getCollapsedPlayerKeys().includes("guests");

    const guests = (window.store && window.store.guests) ? window.store.guests : [];
    const guestCount = guests.length;

    let guestSectionHTML = `
      <div class="player-card ${isCollapsed ? 'is-collapsed' : ''}" id="player-card-guests" data-collapse-key="guests" style="margin-top: 24px;">
        <div class="player-header" onclick="togglePlayerCollapse('guests')">
          <span>👤 臨時 Guest 隊友清單 (共 ${guestCount} 位)</span>
          <span class="collapse-icon" id="collapse-icon-guests">${isCollapsed ? '▲ 展開' : '▼ 收合'}</span>
        </div>
        <div class="player-characters">
    `;

    if (guestCount === 0) {
      guestSectionHTML += `
        <div style="text-align: center; padding: 20px; color: var(--text-muted); font-size: 13px;">
          目前尚無 Guest 隊友。點擊 BOSS 格子右鍵並於組隊彈窗中即可新增。
        </div>`;
    } else {
      guests.forEach(g => {
        let participatedBosses = [];
        const seenTeamIds = new Set(); // 💡 一個隊伍會被多個正式成員各自的 weeklyRecord 引用到，用 teamId 去重，避免同一隊重複顯示
        if (window.store && window.store.weeklyRecords && window.store.teams) {
          Object.keys(window.store.weeklyRecords).forEach(recordKey => {
            const rec = window.store.weeklyRecords[recordKey];
            if (rec && rec.teamId) {
              if (seenTeamIds.has(rec.teamId)) return; // 這隊已經加過了，跳過

              const team = window.store.teams[rec.teamId];
              const members = team.memberTargets || (team.memberCharIds || []).map(id => ({ charId: id, entryIndex: rec.entryIndex }));
              
              if (team && members.some(m => m.charId === g.id)) {
                const boss = window.config.bosses.find(b => b.id === rec.bossId);
                if (boss) {
                  seenTeamIds.add(rec.teamId);
                  participatedBosses.push({
                    recordKey: recordKey,
                    bossName: rec.entryIndex === 2 ? `${boss.name}(重置)` : boss.name,
                    isCompleted: rec.isCompleted,
                    team: team,
                    members: members
                  });
                }
              }
            }
          });
        }

        const participatedCount = participatedBosses.length;

        guestSectionHTML += `
          <div class="character-card">
            <div class="char-header">
              <div class="char-title" style="display: flex; align-items: center; gap: 8px;">
                👤 ${g.name}
                <button onclick="deleteGuestMember('${g.id}')" 
                        title="刪除 Guest 隊友"
                        style="background: transparent; border: none; cursor: pointer; padding: 2px 4px; font-size: 12px; color: #ef4444; border-radius: 4px; line-height: 1;">
                  🗑️
                </button>
              </div>
              <span class="char-badge">已參與 ${participatedCount} 隊</span>
            </div>
            <div class="boss-grid">
        `;

        if (participatedCount === 0) {
          guestSectionHTML += `<div style="grid-column: 1 / -1; font-size: 12px; color: var(--text-muted); font-style: italic; padding: 6px 0;">尚未參與任何 BOSS 隊伍</div>`;
        } else {
          participatedBosses.forEach(item => {
            const memberNames = item.members.map(m => getCharName(m.charId)).join(", ");
            guestSectionHTML += `
              <div class="boss-cell ${item.isCompleted ? 'completed' : 'not-completed'}"
                   onclick="toggleBossStatus('${item.recordKey}')"
                   title="隊伍成員: ${memberNames} (點擊可切換完成狀態)">
                <div class="boss-name">${item.bossName}</div>
                <div class="party-members">${memberNames}</div>
              </div>
            `;
          });
        }

        guestSectionHTML += `
            </div>
          </div>
        `;
      });
    }

    guestSectionHTML += `
        </div>
      </div>
    `;

    container.innerHTML = guestSectionHTML;
  }

  function toggleBossStatus(recordKey) {
    const record = window.store.weeklyRecords[recordKey];
    if (!record || !record.teamId) return;

    const team = window.store.teams[record.teamId];
    const members = team.memberTargets || (team.memberCharIds || []).map(id => ({ charId: id, entryIndex: record.entryIndex }));

    if (!record.isCompleted && team) {
      for (const m of members) {
        if (m.charId.startsWith("guest_")) continue;
        if (getCharacterCompletedCount(m.charId) >= 12) {
          alert(`角色 [${getCharName(m.charId)}] 本週攻略數量已達 12 隻上限！`);
          return;
        }
      }
    }

    const nextStatus = !record.isCompleted;

    // 💡 完成時，如果是多人隊伍又有設定艾里溫碎片、份數又除不盡，要先讓使用者選份數、
    //    按下「確定」才會一起寫入完成狀態跟份數；在那之前完全不動 isCompleted，
    //    不管使用者點 modal 旁邊、點關閉，都不會更新卡片狀態
    if (nextStatus) {
      const boss = window.config.bosses.find(b => b.id === record.bossId);
      const validMembers = members.filter(m => {
        if (!m.charId.startsWith("guest_")) return true;
        return window.store.guests && window.store.guests.some(g => g.id === m.charId);
      });
      const isSolo = validMembers.length <= 1;

      if (boss && boss.erionVestiges && !isSolo) {
        const actualTeamSize = validMembers.length;
        const dividesEvenly = boss.maxPartySize % actualTeamSize === 0;

        if (!dividesEvenly) {
          openShardShareModal(recordKey, true); // true = 完成狀態要等使用者按確定才一起寫入
          return;
        }
      }
    }

    Object.values(window.store.weeklyRecords).forEach(r => {
      if (r.teamId === record.teamId) {
        r.isCompleted = nextStatus;
      }
    });

    // 份數整除的情況，分配沒有爭議，直接自動平分寫入，不用另外詢問
    if (nextStatus) {
      const boss = window.config.bosses.find(b => b.id === record.bossId);
      const validMembers = members.filter(m => {
        if (!m.charId.startsWith("guest_")) return true;
        return window.store.guests && window.store.guests.some(g => g.id === m.charId);
      });
      const isSolo = validMembers.length <= 1;

      if (boss && boss.erionVestiges && !isSolo) {
        const actualTeamSize = validMembers.length;
        const dividesEvenly = boss.maxPartySize % actualTeamSize === 0;
        if (dividesEvenly) {
          const fairShare = boss.maxPartySize / actualTeamSize;
          Object.values(window.store.weeklyRecords).forEach(r => {
            if (r.teamId === record.teamId) {
              r.shardShares = fairShare;
            }
          });
        }
      }
    }

    saveStoreToCloud();
  }

  // ==================== 艾里溫碎片：份數選擇彈窗（一次填完整隊） ====================
  let editingShardRecordKey = null;
  let shardModalPendingComplete = false; // true 代表：按下確定時，除了寫份數，還要一起把完成狀態設為 true
  let shardModalMembers = []; // [{ charId, entryIndex, recordKey, name, value, lastWeek }] 正式角色清單，Guest 不在這裡面（份數用剩下的自動算）

  window.openShardShareModal = function(recordKey, pendingComplete) {
    const record = window.store.weeklyRecords ? window.store.weeklyRecords[recordKey] : null;
    if (!record) return;

    const boss = window.config.bosses.find(b => b.id === record.bossId);
    if (!boss || !boss.erionVestiges) return;

    editingShardRecordKey = recordKey;
    shardModalPendingComplete = !!pendingComplete;

    const maxPartySize = boss.maxPartySize || 1;
    const unitShare = boss.erionVestiges / maxPartySize;

    const titleEl = document.getElementById("shardShareTitle");
    if (titleEl) titleEl.innerText = `🔹 ${boss.name} - 分配這次撿取的艾里溫碎片份數`;

    const team = window.store.teams ? window.store.teams[record.teamId] : null;
    const rawMembers = team ? (team.memberTargets || (team.memberCharIds || []).map(id => ({ charId: id, entryIndex: record.entryIndex }))) : [];
    const validMembers = rawMembers.filter(m => {
      if (!m.charId.startsWith("guest_")) return true;
      return window.store.guests && window.store.guests.some(g => g.id === m.charId);
    });

    const formalMembers = validMembers.filter(m => !m.charId.startsWith("guest_"));
    const guestCount = validMembers.length - formalMembers.length;
    const fairAverage = maxPartySize / (validMembers.length || 1);

    // 每個正式角色的初始值：優先用他自己已經存的 shardShares，沒有的話用公平平均值（四捨五入）當起點
    shardModalMembers = formalMembers.map(m => {
      const memberRecKey = `rec_${m.charId}_${boss.id}_${m.entryIndex}`;
      const memberRec = window.store.weeklyRecords ? window.store.weeklyRecords[memberRecKey] : null;
      const currentValue = memberRec && memberRec.shardShares !== null && memberRec.shardShares !== undefined
        ? memberRec.shardShares
        : Math.round(fairAverage);
      const lastWeek = memberRec && memberRec.lastWeekShardShares !== null && memberRec.lastWeekShardShares !== undefined
        ? memberRec.lastWeekShardShares
        : null;
      // 建議份數：上週拿得比公平平均多的人，這週建議少拿一點；拿得比較少的人建議多拿一點（沒有上週紀錄就不給建議）
      const suggested = lastWeek !== null
        ? (lastWeek > fairAverage ? Math.floor(fairAverage) : Math.ceil(fairAverage))
        : null;
      return { charId: m.charId, entryIndex: m.entryIndex, recordKey: memberRecKey, name: getCharName(m.charId), value: currentValue, lastWeek, suggested };
    });

    renderShardShareEditor(boss, guestCount);

    const modal = document.getElementById("shardShareModal");
    if (modal) modal.style.display = "flex";
  };

  function renderShardShareEditor(boss, guestCount) {
    const maxPartySize = boss.maxPartySize || 1;
    const container = document.getElementById("shardShareOptions");
    if (!container) return;

    let html = `<div class="shard-editor-list">`;
    shardModalMembers.forEach((m, idx) => {
      const lastWeekLabel = m.lastWeek !== null ? `上週 ${m.lastWeek} 份` : "上週無紀錄";
      const suggestedTag = (m.suggested !== null && m.suggested !== m.value)
        ? `<span class="shard-suggested-tag" onclick="applySuggestedShare(${idx})" title="點一下套用建議份數">建議 ${m.suggested} 份</span>`
        : '';

      let optionsHtml = '';
      for (let i = 0; i <= maxPartySize; i++) {
        const isSelected = (m.value === i) ? 'selected' : '';
        optionsHtml += `<option value="${i}" ${isSelected}>${i} 份</option>`;
      }

      html += `
        <div class="shard-editor-row">
          <div class="shard-editor-name">${m.name}<span class="shard-editor-lastweek">${lastWeekLabel}</span>${suggestedTag}</div>
          <select class="shard-editor-select" onchange="updateShardMemberValue(${idx}, this.value)">
            ${optionsHtml}
          </select>
        </div>
      `;
    });

    if (guestCount > 0) {
      html += `
        <div class="shard-editor-row shard-editor-guest-row">
          <div class="shard-editor-name">Guest（共 ${guestCount} 位）<span class="shard-editor-lastweek">沒有自己的紀錄，拿剩下的份數</span></div>
          <div class="shard-editor-guest-value" id="shardGuestRemainder">-</div>
        </div>
      `;
    }

    html += `</div><div class="shard-editor-total" id="shardEditorTotal"></div>`;
    container.innerHTML = html;

    updateShardEditorTotal(boss, guestCount);
  }

  window.updateShardMemberValue = function(idx, rawValue) {
    if (!editingShardRecordKey) return;
    const record = window.store.weeklyRecords[editingShardRecordKey];
    if (!record) return;
    const boss = window.config.bosses.find(b => b.id === record.bossId);
    if (!boss) return;

    const n = parseInt(rawValue, 10);
    shardModalMembers[idx].value = isNaN(n) ? 0 : Math.max(0, n);

    const team = window.store.teams[record.teamId];
    const rawMembers = team.memberTargets || (team.memberCharIds || []).map(id => ({ charId: id }));
    const guestCount = rawMembers.filter(m => m.charId.startsWith("guest_")).length;

    updateShardEditorTotal(boss, guestCount);
  };

  // 點「建議」標籤：直接把該成員的份數改成建議值，並重繪整個編輯區（含輸入框顯示值跟總計）
  window.applySuggestedShare = function(idx) {
    if (!editingShardRecordKey) return;
    const record = window.store.weeklyRecords[editingShardRecordKey];
    if (!record) return;
    const boss = window.config.bosses.find(b => b.id === record.bossId);
    if (!boss) return;

    const m = shardModalMembers[idx];
    if (!m || m.suggested === null || m.suggested === undefined) return;
    m.value = m.suggested;

    const team = window.store.teams[record.teamId];
    const rawMembers = team.memberTargets || (team.memberCharIds || []).map(id => ({ charId: id }));
    const guestCount = rawMembers.filter(mm => mm.charId.startsWith("guest_")).length;

    renderShardShareEditor(boss, guestCount);
  };

  function updateShardEditorTotal(boss, guestCount) {
    const maxPartySize = boss.maxPartySize || 1;
    const formalTotal = shardModalMembers.reduce((sum, m) => sum + (m.value || 0), 0);
    const remainder = maxPartySize - formalTotal;

    const guestEl = document.getElementById("shardGuestRemainder");
    if (guestEl) guestEl.innerText = remainder >= 0 ? `${remainder} 份` : `⚠️ 超過`;

    const totalEl = document.getElementById("shardEditorTotal");
    let isValid;
    if (guestCount > 0) {
      isValid = remainder >= 0;
      if (totalEl) totalEl.innerText = `正式角色合計 ${formalTotal} 份 + Guest ${Math.max(remainder, 0)} 份 = ${formalTotal + Math.max(remainder, 0)} / ${maxPartySize} 份`;
    } else {
      isValid = formalTotal === maxPartySize;
      if (totalEl) totalEl.innerText = `目前合計 ${formalTotal} / ${maxPartySize} 份`;
    }
    if (totalEl) totalEl.className = "shard-editor-total " + (isValid ? "valid" : "invalid");

    const confirmBtn = document.getElementById("shardConfirmBtn");
    if (confirmBtn) confirmBtn.disabled = !isValid;
  }

  window.closeShardShareModal = function() {
    const modal = document.getElementById("shardShareModal");
    if (modal) modal.style.display = "none";
    editingShardRecordKey = null;
    shardModalPendingComplete = false;
    shardModalMembers = [];
  };

  // 按下「確定」才真的寫入：每個正式角色各自的份數，以及（如果是完成流程觸發的）一起把整隊的完成狀態設為 true
  window.confirmShardShare = function() {
    if (!editingShardRecordKey) return;
    const record = window.store.weeklyRecords[editingShardRecordKey];
    if (!record) return;

    const boss = window.config.bosses.find(b => b.id === record.bossId);
    if (!boss) return;

    const maxPartySize = boss.maxPartySize || 1;
    const formalTotal = shardModalMembers.reduce((sum, m) => sum + (m.value || 0), 0);

    const team = window.store.teams[record.teamId];
    const rawMembers = team.memberTargets || (team.memberCharIds || []).map(id => ({ charId: id }));
    const guestCount = rawMembers.filter(m => m.charId.startsWith("guest_")).length;

    if (guestCount > 0) {
      if (formalTotal > maxPartySize) {
        alert(`正式角色的份數加起來（${formalTotal}）已經超過總份數（${maxPartySize}）了，請調整！`);
        return;
      }
    } else if (formalTotal !== maxPartySize) {
      alert(`份數合計要剛好等於 ${maxPartySize} 份，目前是 ${formalTotal} 份，請調整！`);
      return;
    }

    // 有人這次選的份數跟自己上週一樣，二次確認一下
    const sameAsLastWeekNames = shardModalMembers
      .filter(m => m.lastWeek !== null && m.lastWeek === m.value)
      .map(m => m.name);

    if (sameAsLastWeekNames.length > 0) {
      const confirmed = confirm(`${sameAsLastWeekNames.join("、")} 這次選的份數跟上週一樣，連續兩週一樣可能會讓分配不公平，確定要維持嗎？`);
      if (!confirmed) return;
    }

    shardModalMembers.forEach(m => {
      const memberRec = window.store.weeklyRecords[m.recordKey];
      if (memberRec) memberRec.shardShares = m.value;
    });

    if (shardModalPendingComplete) {
      Object.values(window.store.weeklyRecords).forEach(r => {
        if (r.teamId === record.teamId) {
          r.isCompleted = true;
        }
      });
    }

    saveStoreToCloud();
    window.closeShardShareModal();
  };

  // ==================== Modal 與操控邏輯 (重點重構區) ====================
  let editingCharId = null;
  let editingBossId = null;
  let editingEntry = 1;
  let coveredByOtherTeams = new Set(); // 「現有隊伍快速加入」清單裡，屬於別隊（不是正在編輯這隊）的成員，這些人如果還沒被勾選，個別清單就不重複列出

  // 列出「這隻 BOSS 目前已經組好、還有空位」的隊伍，供快速一鍵加入（不分首刷/重置輪次）
  function renderExistingTeamsQuickJoin() {
    const container = document.getElementById("existingTeamsList");
    if (!container) return;

    const boss = window.config.bosses.find(b => b.id === editingBossId);
    const maxPartySize = boss ? boss.maxPartySize : 1;

    // 掃描這隻 BOSS 底下所有的 weeklyRecords，收集不重複的 teamId
    // 💡 用 record 自己存的 bossId 欄位精準比對，不要用 key 字串做 substring 判斷
    //    （否則像 "chaos" 跟 "chaos_hard" 這種一個是另一個子字串的情況，會被誤判成同一隻 BOSS）
    const teamIds = new Set();
    if (window.store.weeklyRecords) {
      Object.values(window.store.weeklyRecords).forEach(rec => {
        if (rec && rec.bossId === editingBossId && rec.teamId) {
          teamIds.add(rec.teamId);
        }
      });
    }

    const selfKey = `${editingCharId}:${editingEntry}`;
    const teamCards = [];

    teamIds.forEach(teamId => {
      const team = window.store.teams ? window.store.teams[teamId] : null;
      if (!team) return;

      const members = team.memberTargets || (team.memberCharIds || []).map(id => ({ charId: id, entryIndex: editingEntry }));

      // 排除單人的預設隊伍，只列出「真的組過」的隊伍
      if (members.length <= 1) return;

      const isSelfInTeam = members.some(m => `${m.charId}:${m.entryIndex}` === selfKey);
      const isFull = members.length >= maxPartySize;

      const memberNames = members.map(m => {
        const name = getCharName(m.charId);
        return m.entryIndex === 2 ? `${name}(重置)` : name;
      }).join("、");

      teamCards.push({ teamId, memberNames, count: members.length, disabled: isSelfInTeam || isFull, isSelfInTeam, isFull });
    });

    // 別隊（不是正在編輯這隊）的成員，個別角色清單要排除，避免跟這裡的快速加入按鈕重複列出
    coveredByOtherTeams = new Set();
    teamCards.forEach(t => {
      if (t.isSelfInTeam) return; // 正在編輯的這隊，成員要留在下面的清單裡讓使用者能勾/取消
      const team = window.store.teams[t.teamId];
      const members = team.memberTargets || (team.memberCharIds || []).map(id => ({ charId: id, entryIndex: editingEntry }));
      members.forEach(m => coveredByOtherTeams.add(`${m.charId}_${m.entryIndex}`));
    });

    if (teamCards.length === 0) {
      container.innerHTML = "";
      return;
    }

    let html = `<div style="font-weight: bold; font-size: 13px; margin-bottom: 6px; color: var(--title-color);">👥 現有隊伍快速加入：</div>`;
    html += `<div style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px;">`;

    teamCards.forEach(t => {
      const reasonTag = t.isSelfInTeam ? "（已在隊中）" : t.isFull ? "（已滿員）" : "";
      html += `
        <button type="button" class="btn btn-secondary" style="text-align:left; font-size:12px; padding:6px 10px; ${t.disabled ? 'opacity:0.5; cursor:not-allowed;' : ''}"
          ${t.disabled ? 'disabled' : `onclick="joinExistingTeam('${t.teamId}')"`}>
          ${t.memberNames}（${t.count}人）${reasonTag}
        </button>`;
    });

    html += `</div>`;
    container.innerHTML = html;
  }

  // 點擊「現有隊伍」時，把該隊成員疊加勾選到目前的清單上（不取代既有勾選）
  function joinExistingTeam(teamId) {
    const team = window.store.teams ? window.store.teams[teamId] : null;
    if (!team) return;

    const members = team.memberTargets || (team.memberCharIds || []).map(id => ({ charId: id, entryIndex: editingEntry }));

    const existingCheckboxes = document.querySelectorAll('input[name="partyChar"]:checked');
    const checkedKeys = new Set(Array.from(existingCheckboxes).map(cb => cb.value));
    members.forEach(m => checkedKeys.add(`${m.charId}_${m.entryIndex}`));

    renderPartySelectList(Array.from(checkedKeys).map(k => {
      const parts = k.split("_");
      const entryIdx = parseInt(parts.pop(), 10);
      return { charId: parts.join("_"), entryIndex: entryIdx };
    }), null, true);

    updatePartyCheckboxStates();
  }

  function renderPartySelectList(initialMemberTargets = [], autoCheckGuestId = null, isFreshOpen = false) {
      const listContainer = document.getElementById("partySelectList");
      const guestContainer = document.getElementById("guestSelectList");
      if (!listContainer || !guestContainer) return;

      const boss = window.config.bosses.find(b => b.id === editingBossId);
      const maxPartySize = boss ? boss.maxPartySize : 1;

      let checkedKeys = [];
      if (isFreshOpen) {
        checkedKeys = initialMemberTargets.map(m => `${m.charId}_${m.entryIndex}`);
      } else {
        const existingCheckboxes = document.querySelectorAll('input[name="partyChar"]:checked');
        if (existingCheckboxes.length > 0) {
          checkedKeys = Array.from(existingCheckboxes).map(cb => cb.value);
        } else {
          checkedKeys = initialMemberTargets.map(m => `${m.charId}_${m.entryIndex}`);
        }
      }

      if (autoCheckGuestId && !checkedKeys.includes(`${autoCheckGuestId}_1`)) {
        checkedKeys.push(`${autoCheckGuestId}_1`);
      }

      // 💡 在標題區塊新增紅字警告提示 (預設 display: none)
      let html = `
        <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 8px;">
          該 BOSS 人數上限為 <b style="color: var(--title-color);">${maxPartySize}</b> 人
          <span id="partyLimitWarning" style="display: none; color: #ef4444; font-weight: bold; margin-left: 6px; background: rgba(239, 68, 68, 0.1); padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(239, 68, 68, 0.2);">
            ⚠️ 已達隊伍人數上限
          </span>
        </div>
        <div style="font-weight: bold; font-size: 13px; margin-bottom: 6px; color: var(--title-color);">⚔️ 正式角色與攻略輪次：</div>
      `;

      const allChars = getAllCharacters();
      
      allChars.forEach(c => {
        const hasNormal = c.bossIds && c.bossIds.includes(editingBossId);
        const hasReset = c.resetBossIds && c.resetBossIds.includes(editingBossId);
        if (!hasNormal && !hasReset) return;

        const availableEntries = [];
        if (hasNormal) availableEntries.push(1);
        if (hasReset) availableEntries.push(2);

        availableEntries.forEach(entryIdx => {
          const targetKey = `${c.id}_${entryIdx}`;
          const isSelf = (c.id === editingCharId && entryIdx === editingEntry);

          // 檢查該角色此卡片是否已屬於「其他已滿員的隊伍」
          if (!isSelf) {
            const targetRecKey = `rec_${c.id}_${editingBossId}_${entryIdx}`;
            const targetRec = window.store.weeklyRecords ? window.store.weeklyRecords[targetRecKey] : null;
            
            if (targetRec && targetRec.teamId) {
              const targetTeam = window.store.teams ? window.store.teams[targetRec.teamId] : null;
              if (targetTeam) {
                const members = targetTeam.memberTargets || (targetTeam.memberCharIds || []).map(id => ({ charId: id, entryIndex: entryIdx }));
                const isSelfInTargetTeam = members.some(m => m.charId === editingCharId && m.entryIndex === editingEntry);

                if (!isSelfInTargetTeam && members.length >= maxPartySize) {
                  return; // 跳過不渲染此選項
                }
              }
            }
          }

          const isChecked = isSelf || checkedKeys.includes(targetKey);

          // 這個人已經被「別隊」的快速加入按鈕涵蓋到了，而且目前還沒被勾選，個別清單就不重複列出
          // （已經勾選的人一律照常顯示，避免存檔時漏掉已經選取的成員）
          if (!isSelf && !isChecked && coveredByOtherTeams.has(targetKey)) {
            return;
          }

          const labelStyle = isSelf 
            ? 'cursor: not-allowed; font-size: 13px; display: flex; align-items: center; gap: 6px; opacity: 0.6; font-weight: bold;' 
            : 'cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 6px;';

          const entryTag = entryIdx === 2 ? ' (重置刷)' : ' (首次刷)';

          html += `
            <label style="${labelStyle}">
              <input type="checkbox" name="partyChar" value="${targetKey}" 
                    data-is-self="${isSelf}"
                    ${isChecked ? 'checked' : ''} 
                    ${isSelf ? 'disabled' : ''} 
                    onchange="updatePartyCheckboxStates()">
              ${c.name} (${c.playerName})${entryTag} ${isSelf ? '✨(隊長)' : ''}
            </label>`;
        });
      });

      listContainer.innerHTML = html;

      let guestHtml = `
        <div style="font-weight: bold; font-size: 13px; margin-bottom: 6px; color: var(--title-color);">👤 Guest 臨時隊友：</div>
        <div style="display: flex; gap: 6px; margin-bottom: 8px;">
          <input type="text" id="newGuestNameInput" placeholder="輸入 Guest 名字" style="flex: 1; padding: 5px 8px; font-size: 12px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-main);" onkeypress="if(event.key==='Enter'){ event.preventDefault(); addGuestMember(); }" />
          <button class="btn" style="padding: 4px 10px; font-size: 12px; white-space: nowrap;" onclick="addGuestMember()">➕ 新增</button>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
      `;

      if (window.store && window.store.guests && window.store.guests.length > 0) {
        window.store.guests.forEach(g => {
          const targetKey = `${g.id}_1`;
          const isChecked = checkedKeys.includes(targetKey);
          guestHtml += `
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <label style="cursor:pointer; font-size: 13px; display: flex; align-items: center; gap: 6px; color: #0284c7;">
                <input type="checkbox" name="partyChar" value="${targetKey}" 
                      data-is-self="false"
                      ${isChecked ? 'checked' : ''} 
                      onchange="updatePartyCheckboxStates()">
                ${g.name} <span style="font-size:11px; color:var(--text-muted);">(Guest)</span>
              </label>
              <button onclick="deleteGuestMember('${g.id}')" style="background: transparent; border: none; cursor: pointer; font-size: 12px; color: #ef4444;" title="刪除 Guest 隊友">🗑️</button>
            </div>`;
        });
      } else {
        guestHtml += `<div style="font-size: 12px; color: var(--text-muted); font-style: italic;">目前尚無 Guest 隊友，可在上方輸入新增。</div>`;
      }
      guestHtml += `</div>`;

      guestContainer.innerHTML = guestHtml;

      // 渲染完成後立刻刷新一次狀態
      updatePartyCheckboxStates();
    }

  window.addGuestMember = function() {
    const input = document.getElementById("newGuestNameInput");
    if (!input) return;
    const guestName = input.value.trim();
    if (!guestName) {
      alert("請輸入 Guest 名字！");
      return;
    }
    if (!window.store.guests) window.store.guests = [];
    
    let guestObj = window.store.guests.find(g => g.name === guestName);
    if (!guestObj) {
      guestObj = { id: `guest_${Date.now()}`, name: guestName };
      window.store.guests.push(guestObj);
      saveStoreToCloud();
    }
    input.value = "";
    renderPartySelectList([], guestObj.id);
  };

  window.deleteGuestMember = function(guestId) {
    if (!confirm("確定要刪除此 Guest 隊友嗎？(已存在該 Guest 的隊伍將會自動移除此隊友)")) return;
    if (window.store) {
      if (window.store.guests) {
        window.store.guests = window.store.guests.filter(g => g.id !== guestId);
      }
      if (window.store.teams) {
        Object.values(window.store.teams).forEach(team => {
          if (team) {
            if (team.memberTargets) {
              team.memberTargets = team.memberTargets.filter(m => m.charId !== guestId);
            }
            if (team.memberCharIds) {
              team.memberCharIds = team.memberCharIds.filter(id => id !== guestId);
            }
          }
        });
      }
      saveStoreToCloud();
      renderPartySelectList();
      renderApp();
    }
  };

  // ==========================================
  // 手機長按 (Long Press) 模擬右鍵 —— 開啟組隊編輯 modal
  // ==========================================
  let longPressTimer = null;
  let longPressFired = false;
  let longPressStartPos = null;
  let longPressCellEl = null;
  const LONG_PRESS_DURATION = 500; // ms
  const LONG_PRESS_MOVE_TOLERANCE = 10; // px

  function handleCellTouchStart(event, charId, bossId, entryIndex) {
    if (event.touches.length !== 1) return;
    longPressFired = false;
    longPressStartPos = { x: event.touches[0].clientX, y: event.touches[0].clientY };
    longPressCellEl = event.currentTarget;

    clearTimeout(longPressTimer);
    longPressTimer = setTimeout(() => {
      longPressFired = true;
      if (longPressCellEl) longPressCellEl.classList.add('long-press-active');
      if (window.navigator && window.navigator.vibrate) window.navigator.vibrate(15);
      openPartyModal(event, charId, bossId, entryIndex);
    }, LONG_PRESS_DURATION);
  }

  function handleCellTouchMove(event) {
    if (!longPressStartPos || event.touches.length !== 1) return;
    const dx = Math.abs(event.touches[0].clientX - longPressStartPos.x);
    const dy = Math.abs(event.touches[0].clientY - longPressStartPos.y);
    if (dx > LONG_PRESS_MOVE_TOLERANCE || dy > LONG_PRESS_MOVE_TOLERANCE) {
      clearTimeout(longPressTimer);
    }
  }

  function savePartyTeam() {
    const boss = window.config.bosses.find(b => b.id === editingBossId);
    const checkboxes = document.querySelectorAll('input[name="partyChar"]:checked');

    // 解析勾選的 "charId_entryIndex" —— 這是使用者在這個 modal 裡「親眼看到並主動勾選」的成員
    let selectedTargets = Array.from(checkboxes).map(cb => {
      const parts = cb.value.split("_");
      const entryIdx = parseInt(parts.pop(), 10);
      const cId = parts.join("_");
      return { charId: cId, entryIndex: entryIdx };
    });

    if (selectedTargets.length === 0) {
      selectedTargets = [{ charId: editingCharId, entryIndex: editingEntry }];
    }

    const targetKey = (t) => `${t.charId}:${t.entryIndex}`;

    // 找出「選取清單中每一位成員」各自原本所屬的隊伍（正式角色才有自己的 record，Guest 沒有）
    const oldTeamsByTarget = new Map(); // key -> members[]
    selectedTargets.forEach(sel => {
      if (sel.charId.startsWith("guest_")) return;
      const recKey = `rec_${sel.charId}_${editingBossId}_${sel.entryIndex}`;
      const rec = window.store.weeklyRecords[recKey];
      if (rec && rec.teamId && window.store.teams[rec.teamId]) {
        const oldTeam = window.store.teams[rec.teamId];
        const members = oldTeam.memberTargets || (oldTeam.memberCharIds || []).map(id => ({ charId: id, entryIndex: sel.entryIndex }));
        oldTeamsByTarget.set(targetKey(sel), members);
      }
    });

    // 1. 自動合併：這次新勾選的成員（不含正在編輯的 editingCharId 自己），
    //    如果原本就在其他隊伍，把該隊隊友一併拉進來（editingCharId 自己的舊隊伍成員已經是這個 modal 一開始就顯示、可被使用者親自勾/取消的清單，不強制合併，尊重使用者的明確取消勾選）
    const finalMap = new Map();
    selectedTargets.forEach(t => finalMap.set(targetKey(t), t));

    const autoMergedNames = [];
    selectedTargets.forEach(sel => {
      if (sel.charId === editingCharId) return;
      const oldMembers = oldTeamsByTarget.get(targetKey(sel)) || [];
      oldMembers.forEach(m => {
        // 💡 Guest 在這個組隊視窗裡永遠都是可見、可以自己勾/取消的選項（不像正式角色可能因為沒排定這隻 BOSS 而完全不會出現），
        //    所以不強制把 Guest 合併回來，尊重使用者當下實際的勾選狀態，避免明明取消勾選了、存檔後又被偷偷加回去
        if (m.charId.startsWith("guest_")) return;
        if (finalMap.has(targetKey(m))) return;

        // 💡 這個人已經用「另一個身份」（不同 entryIndex）出現在目前名單裡了，不要再合併回來，
        //    避免形成同一人同時佔用首刷+重置兩個身份的無效狀態（也避免跟下面的重複檢查形成死結）
        const alreadyPresentAtOtherEntry = Array.from(finalMap.values()).some(existing => existing.charId === m.charId);
        if (alreadyPresentAtOtherEntry) return;

        finalMap.set(targetKey(m), m);
        autoMergedNames.push(getCharName(m.charId));
      });
    });

    const finalTargets = Array.from(finalMap.values());

    // 💡 同一個角色不能同時以「首刷」跟「重置刷」的身份出現在同一隊裡——
    //    這會讓兩筆本該獨立的紀錄共用同一個 teamId，導致切換完成狀態時兩邊被綁在一起同步
    const charIdCounts = new Map();
    finalTargets.forEach(t => {
      charIdCounts.set(t.charId, (charIdCounts.get(t.charId) || 0) + 1);
    });
    const duplicatedCharIds = Array.from(charIdCounts.entries()).filter(([, cnt]) => cnt > 1).map(([id]) => id);
    if (duplicatedCharIds.length > 0) {
      const names = duplicatedCharIds.map(id => getCharName(id)).join("、");
      alert(`「${names}」不能同時以「首次刷」跟「重置刷」的身份出現在同一個隊伍裡，這樣兩邊的完成狀態會被綁在一起、沒辦法分開紀錄。\n請確認每個角色只勾選其中一個身份。`);
      return;
    }

    if (finalTargets.length > boss.maxPartySize) {
      const mergedNote = autoMergedNames.length > 0 ? `（含自動合併的隊友：${autoMergedNames.join(", ")}）` : "";
      alert(`該 BOSS 人數上限為 ${boss.maxPartySize} 人，合併後共 ${finalTargets.length} 人${mergedNote}，請手動調整勾選！`);
      return;
    }

    // 2. 建立新隊伍與儲存出團時間排程
    const sortedKey = finalTargets.map(t => `${t.charId}:${t.entryIndex}`).sort().join("_");
    const sharedTeamId = `team_${editingBossId}_${sortedKey}`;
    const schedule = readPartyScheduleFromForm();

    if (!window.store.teams) window.store.teams = {};
    window.store.teams[sharedTeamId] = { 
      id: sharedTeamId, 
      memberTargets: finalTargets,
      memberCharIds: finalTargets.map(t => t.charId), // 相容保留
      schedule: schedule
    };

    // 3. 更新最終隊伍成員各自輪次的記錄
    finalTargets.forEach(target => {
      if (target.charId.startsWith("guest_")) return;
      const recKey = `rec_${target.charId}_${editingBossId}_${target.entryIndex}`;
      const oldRecord = window.store.weeklyRecords[recKey];
      window.store.weeklyRecords[recKey] = {
        charId: target.charId,
        bossId: editingBossId,
        entryIndex: target.entryIndex,
        teamId: sharedTeamId,
        isCompleted: oldRecord ? oldRecord.isCompleted : false,
        shardShares: (oldRecord && oldRecord.shardShares !== undefined) ? oldRecord.shardShares : null,
        lastWeekShardShares: (oldRecord && oldRecord.lastWeekShardShares !== undefined) ? oldRecord.lastWeekShardShares : null
      };
    });

    // 4. 清理：這次牽涉到的所有舊隊伍成員（聯集），如果最後沒有留在新隊伍裡，恢復成他們的單人預設隊伍
    //    （用聯集而非只看 editingCharId 自己的舊隊伍，才不會漏掉像 B 這種「被間接牽連但沒被看到」的成員）
    const unionOldMap = new Map();
    oldTeamsByTarget.forEach(members => {
      members.forEach(m => unionOldMap.set(targetKey(m), m));
    });

    const removedTargets = Array.from(unionOldMap.values()).filter(oldT => !finalMap.has(targetKey(oldT)));

    removedTargets.forEach(target => {
      if (target.charId.startsWith("guest_")) return;
      const defaultTeamId = `single_${target.charId}_${editingBossId}_${target.entryIndex}`;
      const recKey = `rec_${target.charId}_${editingBossId}_${target.entryIndex}`;
      const oldRecord = window.store.weeklyRecords[recKey];

      window.store.teams[defaultTeamId] = {
        id: defaultTeamId,
        memberTargets: [{ charId: target.charId, entryIndex: target.entryIndex }],
        memberCharIds: [target.charId]
      };

      window.store.weeklyRecords[recKey] = {
        charId: target.charId,
        bossId: editingBossId,
        entryIndex: target.entryIndex,
        teamId: defaultTeamId,
        isCompleted: oldRecord ? oldRecord.isCompleted : false,
        shardShares: (oldRecord && oldRecord.shardShares !== undefined) ? oldRecord.shardShares : null,
        lastWeekShardShares: (oldRecord && oldRecord.lastWeekShardShares !== undefined) ? oldRecord.lastWeekShardShares : null
      };
    });

    saveStoreToCloud();
    renderApp();
    closePartyModal();

    if (autoMergedNames.length > 0) {
      alert(`已自動將以下隊友一併加入隊伍：${autoMergedNames.join(", ")}`);
    }
  }

  // ==========================================
  // 隊伍出團時間排程與格式化輔助函式
  // ==========================================
  const DAY_NAMES = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];

  function getTeamEffectiveSchedule(team) {
    if (!team || !team.schedule) return null;
    const currentWeekKey = getCurrentResetWeekKey();
    if (team.schedule.tempOverride && team.schedule.tempOverride.weekKey === currentWeekKey && team.schedule.tempOverride.dayOfWeek !== null && team.schedule.tempOverride.dayOfWeek !== undefined) {
      return {
        type: "temp",
        dayOfWeek: parseInt(team.schedule.tempOverride.dayOfWeek, 10),
        time: team.schedule.tempOverride.time || "21:00",
        isTemp: true
      };
    }
    if (team.schedule.recurring && team.schedule.recurring.dayOfWeek !== null && team.schedule.recurring.dayOfWeek !== undefined && team.schedule.recurring.time) {
      return {
        type: "recurring",
        dayOfWeek: parseInt(team.schedule.recurring.dayOfWeek, 10),
        time: team.schedule.recurring.time,
        isTemp: false
      };
    }
    return null;
  }

  function formatScheduleDisplay(effectiveSchedule) {
    if (!effectiveSchedule) return "";
    const dayName = DAY_NAMES[effectiveSchedule.dayOfWeek] || "";
    if (effectiveSchedule.isTemp) {
      return `⚡ 臨時改 ${dayName} ${effectiveSchedule.time}`;
    }
    return `⏰ ${dayName} ${effectiveSchedule.time}`;
  }

  function getTeamRaidDateTimeThisWeek(effectiveSchedule, now = new Date()) {
    if (!effectiveSchedule || effectiveSchedule.dayOfWeek === null || effectiveSchedule.dayOfWeek === undefined || !effectiveSchedule.time) {
      return null;
    }
    const [hours, minutes] = effectiveSchedule.time.split(":").map(Number);
    const currentDay = now.getDay(); // 0:日 ~ 6:六
    const daysSinceThursday = (currentDay - 4 + 7) % 7;
    const thursday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - daysSinceThursday, 0, 0, 0, 0);

    const targetDay = parseInt(effectiveSchedule.dayOfWeek, 10);
    const daysFromThursday = (targetDay - 4 + 7) % 7;

    const targetDate = new Date(thursday);
    targetDate.setDate(thursday.getDate() + daysFromThursday);
    targetDate.setHours(hours, minutes, 0, 0);
    return targetDate;
  }

  function checkIfTeamCompletedThisWeek(team) {
    if (!team || !window.store || !window.store.weeklyRecords) return false;
    const members = team.memberTargets || (team.memberCharIds || []).map(id => ({ charId: id, entryIndex: 1 }));
    const formalMembers = members.filter(m => !m.charId.startsWith("guest_"));
    if (formalMembers.length === 0) return false;

    // 只要有正式角色的 weeklyRecord 存在，檢查是否全都完成
    return formalMembers.every(m => {
      const records = Object.values(window.store.weeklyRecords);
      const rec = records.find(r => r && r.charId === m.charId && r.entryIndex === m.entryIndex && r.teamId === team.id);
      return rec ? rec.isCompleted : false;
    });
  }

  function loadPartyScheduleIntoForm(schedule) {
    const recurringDayEl = document.getElementById("partyScheduleRecurringDay");
    const recurringTimeEl = document.getElementById("partyScheduleRecurringTime");
    const tempCheckEl = document.getElementById("partyScheduleTempCheck");
    const tempDayEl = document.getElementById("partyScheduleTempDay");
    const tempTimeEl = document.getElementById("partyScheduleTempTime");
    const tempContainer = document.getElementById("partyScheduleTempInputs");

    if (!recurringDayEl) return;
    const currentWeek = getCurrentResetWeekKey();

    if (schedule && schedule.recurring && schedule.recurring.dayOfWeek !== null && schedule.recurring.dayOfWeek !== undefined) {
      recurringDayEl.value = String(schedule.recurring.dayOfWeek);
      recurringTimeEl.value = schedule.recurring.time || "21:00";
    } else {
      recurringDayEl.value = "";
      recurringTimeEl.value = "21:00";
    }

    if (schedule && schedule.tempOverride && schedule.tempOverride.weekKey === currentWeek && schedule.tempOverride.dayOfWeek !== null && schedule.tempOverride.dayOfWeek !== undefined) {
      tempCheckEl.checked = true;
      tempDayEl.value = String(schedule.tempOverride.dayOfWeek);
      tempTimeEl.value = schedule.tempOverride.time || "21:00";
      if (tempContainer) tempContainer.style.display = "flex";
    } else {
      tempCheckEl.checked = false;
      tempDayEl.value = recurringDayEl.value || "6";
      tempTimeEl.value = recurringTimeEl.value || "21:00";
      if (tempContainer) tempContainer.style.display = "none";
    }
  }

  function readPartyScheduleFromForm() {
    const recurringDay = document.getElementById("partyScheduleRecurringDay").value;

    const hasTemp = document.getElementById("partyScheduleTempCheck").checked;
    const tempDay = document.getElementById("partyScheduleTempDay").value;

  function playNotificationChime() {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      const ctx = new AudioCtx();
      const now = ctx.currentTime;
      const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
      notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, now + i * 0.1);
        gain.gain.setValueAtTime(0.18, now + i * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.1 + 0.5);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + i * 0.1);
        osc.stop(now + i * 0.1 + 0.5);
      });
    } catch (e) {
      console.warn("Audio play error:", e);
    }
  }
